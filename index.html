<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AidantPro — Coordination famille & soins</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bl:#1D55E8;--bl2:#EBF0FD;--bl3:#BFCFFA;--gn:#137A3A;--gn2:#EAF5EE;--gn3:#C8E8D3;--am:#B85C00;--am2:#FEF3E6;--am3:#FDDDB8;--rd:#C0272B;--rd2:#FDEAEA;--rd3:#F8C5C5;--pu:#5B21B6;--pu2:#EDE9FE;--txt:#1A1815;--mu:#6B6860;--bg:#F7F5F1;--sur:#FFF;--bd:#E2DDD5;--sw:230px}
body{font-family:'Instrument Sans',sans-serif;color:var(--txt);background:var(--bg)}
input,button,select,textarea{font-family:inherit}

/* ── AUTH ── */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
@media(max-width:768px){.auth-wrap{grid-template-columns:1fr}}
.auth-left{background:linear-gradient(160deg,#0D1B4B 0%,#1D55E8 45%,#137A3A 100%);padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-left::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='2' fill='%23fff' fill-opacity='.03'/%3E%3C/svg%3E")}
@media(max-width:768px){.auth-left{display:none}}
.al-logo{display:flex;align-items:center;gap:12px;position:relative}
.al-ic{width:44px;height:44px;background:rgba(255,255,255,.15);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid rgba(255,255,255,.2)}
.al-nm{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:#fff}
.al-body{position:relative}
.al-h{font-family:'Syne',sans-serif;font-size:36px;font-weight:800;color:#fff;line-height:1.15;margin-bottom:14px;letter-spacing:-1px}
.al-sub{font-size:14px;color:rgba(255,255,255,.7);line-height:1.7;margin-bottom:28px}
.al-stats{display:flex;flex-direction:column;gap:10px}
.al-stat{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border-radius:10px;padding:11px 14px;border:1px solid rgba(255,255,255,.15)}
.al-stat-ic{font-size:18px;flex-shrink:0}
.al-stat-txt{font-size:12px;color:rgba(255,255,255,.85);line-height:1.4}
.al-stat-txt strong{color:#fff}
.al-ft{position:relative;font-size:11px;color:rgba(255,255,255,.4)}
.auth-right{padding:40px;display:flex;flex-direction:column;justify-content:center;background:var(--sur);overflow-y:auto}
.auth-right-in{max-width:400px;width:100%;margin:0 auto}
.mob-logo{display:none;align-items:center;gap:10px;margin-bottom:28px}
@media(max-width:768px){.mob-logo{display:flex}}
.mob-ic{width:36px;height:36px;background:linear-gradient(135deg,var(--bl),var(--gn));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px}
.mob-nm{font-family:'Syne',sans-serif;font-size:19px;font-weight:800}
.auth-h{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;margin-bottom:5px;letter-spacing:-.5px}
.auth-sub{font-size:13px;color:var(--mu);margin-bottom:22px;line-height:1.6}
.tabs{display:flex;background:var(--bg);border-radius:9px;padding:3px;margin-bottom:20px}
.tab{flex:1;padding:7px;border-radius:7px;border:none;background:transparent;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--mu)}
.tab.on{background:var(--sur);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.fg{margin-bottom:13px}
.fl{font-size:10px;font-weight:600;color:var(--mu);margin-bottom:4px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.5px}
.flink{font-size:10px;font-weight:500;color:var(--bl);cursor:pointer;text-transform:none;letter-spacing:0;border:none;background:none;padding:0}
.fi-w{position:relative}
.fi{width:100%;padding:10px 13px;border:1.5px solid var(--bd);border-radius:9px;font-size:13px;background:var(--bg);color:var(--txt);outline:none;transition:all .15s}
.fi:focus{border-color:var(--bl);background:var(--sur);box-shadow:0 0 0 3px rgba(29,85,232,.07)}
.fi.ferr{border-color:var(--rd);background:var(--rd2)}
.fi.fok{border-color:var(--gn)}
.eye{position:absolute;right:11px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--mu);background:none;border:none;font-size:15px;padding:3px}
.fi-ic{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:13px}
.errmsg{font-size:11px;color:var(--rd);margin-top:3px}
.pwd-bars{display:flex;gap:3px;margin:5px 0 3px}
.pwd-bar{flex:1;height:3px;border-radius:2px;background:var(--bd);transition:background .2s}
.pwd-bar.s1{background:var(--rd)}.pwd-bar.s2{background:var(--am)}.pwd-bar.s3{background:#F59E0B}.pwd-bar.s4{background:var(--gn)}
.pwd-reqs{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.req{font-size:10px;color:var(--mu);display:flex;align-items:center;gap:4px}
.req.ok{color:var(--gn)}
.req-dot{width:5px;height:5px;border-radius:50%;background:var(--bd);flex-shrink:0}
.req.ok .req-dot{background:var(--gn)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:13px}
.role-opt{border:1.5px solid var(--bd);border-radius:9px;padding:10px 6px;cursor:pointer;text-align:center;transition:all .15s;background:transparent}
.role-opt:hover,.role-opt.sel{border-color:var(--bl);background:var(--bl2)}
.role-opt-ic{font-size:20px;margin-bottom:3px}
.role-opt-nm{font-size:11px;font-weight:600}
.role-opt.sel .role-opt-nm{color:var(--bl)}
.role-opt-ds{font-size:9px;color:var(--mu);margin-top:1px}
.cb-row{display:flex;align-items:flex-start;gap:9px;margin-bottom:13px;cursor:pointer}
.cb{width:15px;height:15px;border:1.5px solid var(--bd);border-radius:4px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cb.on{background:var(--bl);border-color:var(--bl)}
.cb-lbl{font-size:11px;color:var(--mu);line-height:1.5}
.auth-btn{width:100%;padding:12px;background:var(--bl);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:7px}
.auth-btn:hover{background:#1544C8}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.alert{padding:10px 13px;border-radius:9px;font-size:12px;margin-bottom:13px;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.alert.aerr{background:var(--rd2);color:var(--rd);border:1px solid var(--rd3)}
.alert.aok{background:var(--gn2);color:var(--gn);border:1px solid var(--gn3)}
.alert.ainfo{background:var(--bl2);color:var(--bl);border:1px solid var(--bl3)}
.sec-box{background:var(--gn2);border:1px solid var(--gn3);border-radius:9px;padding:11px 13px;margin-top:18px;display:flex;gap:9px}
.sec-txt{font-size:11px;color:var(--gn);line-height:1.5}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:#fff;border-radius:14px;padding:24px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto}
.modal h2{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;margin-bottom:12px}
.modal p{font-size:12px;color:var(--mu);line-height:1.8;margin-bottom:8px}
.modal-close{width:100%;margin-top:14px;padding:10px;background:var(--bl);color:#fff;border:none;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer}

/* ── PATIENT ── */
.pat{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.pat-hd{background:linear-gradient(135deg,var(--bl),var(--gn));padding:18px 20px;display:flex;align-items:center;justify-content:space-between}
.pat-hd-logo{display:flex;align-items:center;gap:9px}
.pat-hd-ic{width:33px;height:33px;background:rgba(255,255,255,.2);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.pat-hd-nm{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:#fff}
.pat-hd-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer}
.pat-body{flex:1;padding:22px 18px}
.pat-hello{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;margin-bottom:5px}
.pat-sub{font-size:15px;color:var(--mu);margin-bottom:24px}
.pat-btns{display:flex;flex-direction:column;gap:12px}
.pb{width:100%;padding:20px 22px;border-radius:16px;border:none;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:14px;text-align:left}
.pb:hover{transform:translateY(-2px)}
.pb-ic{font-size:30px;flex-shrink:0}
.pb-tx{font-family:'Syne',sans-serif;font-size:19px;font-weight:700}
.pb-sub{font-size:12px;opacity:.8;margin-top:2px}
.pb-m{background:linear-gradient(135deg,var(--bl2),#D4E0FB);border:2px solid var(--bl3)}
.pb-m .pb-tx{color:var(--bl)}
.pb-r{background:linear-gradient(135deg,var(--gn2),#BBF7D0);border:2px solid var(--gn3)}
.pb-r .pb-tx{color:var(--gn)}
.pb-msg{background:linear-gradient(135deg,var(--am2),#FDE9C8);border:2px solid var(--am3)}
.pb-msg .pb-tx{color:var(--am)}
.feel-row{display:flex;gap:9px;margin-top:14px}
.feel-btn{flex:1;padding:13px 6px;border-radius:12px;border:2px solid var(--bd);background:var(--sur);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;text-align:center}
.feel-btn.fsel{border-color:var(--gn);background:var(--gn2);color:var(--gn)}
.sub-hd{background:var(--sur);border-bottom:1px solid var(--bd);padding:14px 18px;display:flex;align-items:center;gap:11px}
.back-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--bl)}
.sub-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:800}
.sub-body{flex:1;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.med-card{background:var(--sur);border-radius:16px;border:2px solid var(--bd);padding:18px}
.med-nm{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;margin-bottom:3px}
.med-dose{font-size:14px;color:var(--mu);margin-bottom:14px}
.med-btns{display:flex;gap:9px;flex-wrap:wrap}
.med-btn{padding:11px 18px;border-radius:12px;border:2px solid var(--bd);background:transparent;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.med-btn.ok{background:var(--gn2);border-color:var(--gn);color:var(--gn)}
.rdv-card{background:var(--sur);border-radius:16px;border:2px solid var(--gn3);padding:22px}
.rdv-date{font-family:'Syne',sans-serif;font-size:40px;font-weight:800;color:var(--gn);line-height:1}
.rdv-mo{font-size:16px;color:var(--gn);font-weight:600;margin-bottom:10px}
.rdv-ti{font-size:18px;font-weight:700;margin-bottom:5px}
.rdv-li{font-size:14px;color:var(--mu)}
.rdv-hr{font-size:16px;font-weight:600;color:var(--bl);margin-top:8px}
.msg-box{background:var(--sur);border-radius:16px;border:2px solid var(--bd);padding:18px;flex:1}
.msg-ta{width:100%;border:none;outline:none;font-size:17px;line-height:1.7;resize:none;min-height:180px;background:transparent}
.msg-send{width:100%;padding:16px;background:var(--am);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.msg-sent{text-align:center;padding:36px 18px;font-size:19px;font-weight:700;color:var(--gn)}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lang-card{background:var(--sur);border:2px solid var(--bd);border-radius:12px;padding:14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px}
.lang-card:hover,.lang-card.lsel{border-color:var(--bl);background:var(--bl2)}
.lang-flag{font-size:26px}
.lang-nm{font-size:14px;font-weight:700}

/* ── AIDANT APP ── */
.app{display:flex;min-height:100vh}
.sb{width:var(--sw);background:var(--sur);border-right:1.5px solid var(--bd);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:100;overflow-y:auto}
.sb-hd{padding:16px 14px 12px;border-bottom:1px solid var(--bd)}
.sb-logo{display:flex;align-items:center;gap:9px}
.sb-logo-ic{width:32px;height:32px;background:linear-gradient(135deg,var(--bl),var(--gn));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff}
.sb-logo-nm{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;letter-spacing:-.5px}
.pc{margin:10px 10px 0;background:linear-gradient(135deg,var(--bl2),#E8F5EE);border:1px solid var(--bl3);border-radius:10px;padding:9px 11px;cursor:pointer}
.pc-n{font-size:12px;font-weight:600;color:var(--bl)}
.pc-s{font-size:10px;color:var(--mu);margin-top:2px}
.ni{display:flex;align-items:center;gap:8px;padding:7px 9px;margin:1px 7px;border-radius:7px;cursor:pointer;transition:background .12s;border:none;background:transparent;width:calc(100% - 14px);text-align:left}
.ni:hover{background:var(--bg)}
.ni.on{background:var(--bl2)}
.ni-ic{font-size:13px;width:18px;text-align:center;color:var(--mu)}
.ni.on .ni-ic{color:var(--bl)}
.ni-lb{font-size:12px;font-weight:500;color:var(--mu)}
.ni.on .ni-lb{color:var(--bl);font-weight:600}
.sb-ft{margin-top:auto;padding:12px 14px;border-top:1px solid var(--bd);font-size:10px;color:#A8A49C}
.sb-ft strong{color:var(--gn);font-weight:600}
.sb-sw{margin:7px 10px;background:none;border:1px solid var(--bd);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:600;color:var(--mu);cursor:pointer;width:calc(100% - 20px)}
.sb-sw:hover{border-color:var(--bl);color:var(--bl);background:var(--bl2)}
.main{margin-left:var(--sw);flex:1;padding:24px 28px;min-height:100vh;max-width:calc(100vw - var(--sw))}
.ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.pt{font-family:'Syne',sans-serif;font-size:21px;font-weight:800;letter-spacing:-.5px}
.ps{font-size:12px;color:var(--mu);margin-top:2px}
.card{background:var(--sur);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;margin-bottom:13px}
.ct{font-size:9px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:13px}
.kpi{background:var(--sur);border:1px solid var(--bd);border-radius:11px;padding:13px 14px}
.kv{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;line-height:1.1}
.kl{font-size:10px;color:var(--mu);margin-top:3px;font-weight:500}
.al{display:flex;align-items:flex-start;gap:7px;padding:8px 11px;border-radius:7px;font-size:11px;margin-bottom:6px;font-weight:500;line-height:1.5}
.al-w{background:var(--am2);color:var(--am);border:1px solid var(--am3)}
.al-d{background:var(--rd2);color:var(--rd);border:1px solid var(--rd3)}
.al-s{background:var(--gn2);color:var(--gn);border:1px solid var(--gn3)}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.b-bl{background:var(--bl2);color:var(--bl)}.b-gn{background:var(--gn2);color:var(--gn)}.b-am{background:var(--am2);color:var(--am)}.b-rd{background:var(--rd2);color:var(--rd)}.b-mu{background:var(--bg);color:var(--mu);border:1px solid var(--bd)}
.tag-i{display:inline-flex;align-items:center;gap:4px;padding:2px 7px 2px 9px;border-radius:20px;font-size:11px;font-weight:500;margin:2px}
.tag-rm{background:none;border:none;cursor:pointer;font-size:13px;color:inherit;opacity:.6}
.mr{display:flex;align-items:flex-start;justify-content:space-between;gap:11px;padding:11px 0;border-bottom:1px solid var(--bd)}
.mr:last-child{border-bottom:none}
.mn{font-size:13px;font-weight:600;margin-bottom:2px}
.md{font-size:11px;color:var(--mu)}
.hg{display:flex;gap:5px;flex-wrap:wrap}
.hb{padding:4px 10px;border-radius:18px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--bd);background:transparent;transition:all .12s}
.hb.ok{background:var(--gn2);border-color:var(--gn);color:var(--gn)}
.rc{background:var(--sur);border:1px solid var(--bd);border-radius:11px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px}
.rd-dt{border-radius:8px;padding:7px 9px;text-align:center;min-width:44px;flex-shrink:0}
.rd-day{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;line-height:1.1}
.rd-mo{font-size:9px;text-transform:uppercase;font-weight:600}
.je{border-left:3px solid;padding:10px 0 10px 14px;margin-bottom:14px}
.je.bien{border-color:var(--gn)}.je.moyen{border-color:var(--am)}.je.difficile{border-color:var(--rd)}
.jm{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.jd{font-size:11px;font-weight:600;color:var(--mu)}
.ja{font-size:11px;color:var(--bl);font-weight:500}
.jc{font-size:12px;line-height:1.75}
.ac{background:var(--sur);border:1px solid var(--bd);border-radius:11px;padding:14px;margin-bottom:10px}
.an{font-size:13px;font-weight:600;margin-bottom:5px;line-height:1.4}
.am-v{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:7px}
.zq{background:var(--sur);border:1px solid var(--bd);border-radius:11px;padding:12px 14px;margin-bottom:7px}
.zt{font-size:12px;line-height:1.55;margin-bottom:8px}
.zo{display:flex;gap:5px;flex-wrap:wrap}
.zob{flex:1;min-width:60px;padding:6px 3px;border-radius:7px;border:1.5px solid var(--bd);font-size:10px;cursor:pointer;text-align:center;font-weight:500;background:transparent}
.zob.s0{border-color:var(--gn);background:var(--gn2);color:var(--gn)}
.zob.s1{border-color:#4D9E65;background:#F0FAF3;color:#4D9E65}
.zob.s2{border-color:var(--am);background:var(--am2);color:var(--am)}
.zob.s3{border-color:#C04A20;background:#FFF0E8;color:#C04A20}
.zob.s4{border-color:var(--rd);background:var(--rd2);color:var(--rd)}
.sbar{height:7px;border-radius:4px;background:var(--bd);overflow:hidden;margin:7px 0}
.sfill{height:100%;border-radius:4px;transition:width .5s}
.fg{margin-bottom:11px}
.fl{font-size:9px;font-weight:600;color:var(--mu);margin-bottom:3px;display:block;text-transform:uppercase;letter-spacing:.5px}
.fi{width:100%;padding:7px 10px;border:1px solid var(--bd);border-radius:7px;font-size:12px;background:var(--bg);color:var(--txt);outline:none}
.fi:focus{border-color:var(--bl);background:var(--sur)}
.fta{resize:vertical;min-height:64px;line-height:1.6}
.fsel{appearance:none}
.btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.bp{background:var(--bl);color:#fff}.bs{background:var(--bg);color:var(--txt);border:1px solid var(--bd)}.bg2{background:var(--gn);color:#fff}.br2{background:var(--rd2);color:var(--rd);border:1px solid var(--rd3)}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

// ═══════════════════════════════════
// CONFIG SUPABASE
// ═══════════════════════════════════
const SB = 'https://yyfumysysdowpcnqeehs.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5ZnVteXN5c2Rvd3BjbnFlZWhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NjI0NTUsImV4cCI6MjA5NDEzODQ1NX0.jYlYaildOLYgeSZWi_khNO9UusUl6hW-CUBkYvsSyjM';
const H = {'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY};

// ═══════════════════════════════════
// SUPABASE API (fetch direct, no SDK)
// ═══════════════════════════════════
async function sbSignIn(email, pwd) {
  const r = await fetch(SB+'/auth/v1/token?grant_type=password', {method:'POST',headers:H,body:JSON.stringify({email,password:pwd})});
  return r.json();
}
async function sbSignUp(email, pwd, prenom, nom, role) {
  const r = await fetch(SB+'/auth/v1/signup', {method:'POST',headers:H,body:JSON.stringify({email,password:pwd,data:{prenom,nom,role}})});
  return r.json();
}
async function sbSignOut(token) {
  try { await fetch(SB+'/auth/v1/logout', {method:'POST',headers:{...H,'Authorization':'Bearer '+token}}); } catch(e){}
}
async function sbResetPwd(email) {
  try { await fetch(SB+'/auth/v1/recover', {method:'POST',headers:H,body:JSON.stringify({email})}); } catch(e){}
}

// Session
const SK = 'ap_s';
function getS() { try{return JSON.parse(sessionStorage.getItem(SK)||'null');}catch{return null;} }
function saveS(s) { s?sessionStorage.setItem(SK,JSON.stringify(s)):sessionStorage.removeItem(SK); }

// Helpers sécurité
function vEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.trim());}
function clean(s){return s.replace(/[<>'"]/g,'').trim();}
const _rl={};
function rateOk(k){const n=Date.now();if(!_rl[k])_rl[k]=[];_rl[k]=_rl[k].filter(t=>n-t<900000);if(_rl[k].length>=5)return false;_rl[k].push(n);return true;}
function pwdS(p){const c={a:p.length>=8,b:/[A-Z]/.test(p),c:/[0-9]/.test(p),d:/[^A-Za-z0-9]/.test(p)};return{score:Object.values(c).filter(Boolean).length,c};}

// Données démo
const MEDS_INIT=[{id:1,nom:"Donépézil",dose:"10mg",horaires:["20h00"],renouv:5,indication:"Alzheimer",prises:{}},{id:2,nom:"Amlodipine",dose:"5mg",horaires:["08h00"],renouv:18,indication:"Hypertension",prises:{}},{id:3,nom:"Metformine",dose:"500mg",horaires:["08h00","13h00","20h00"],renouv:22,indication:"Diabète",prises:{}}];
const RDV_INIT=[{id:1,titre:"Neurologue Dr. Benali",date:"2026-05-28",heure:"14h30",lieu:"CHU Grenoble",assigne:"",fait:false},{id:2,titre:"Cardiologue Dr. Faure",date:"2026-06-05",heure:"10h15",lieu:"Clinique Belledonne",assigne:"",fait:false}];
const JOURNAL_INIT=[{id:1,date:"2026-05-12",auteur:"Marie",humeur:"bien",contenu:"Pierre bien dormi. Humeur calme. A mangé tout son petit déjeuner.",tension:"13/8"},{id:2,date:"2026-05-11",auteur:"Marie",humeur:"moyen",contenu:"Légère confusion en fin d'après-midi. Refus médicament du soir.",tension:"14/9"}];
const AIDES=[{nom:"APA – Allocation Personnalisée d'Autonomie",montant:"jusqu'à 1 807€/mois",cond:"GIR 1 à 4, 60 ans+",dossier:"Conseil Départemental",ok:true},{nom:"AJPA – Allocation Journalière Proche Aidant",montant:"64€/jour",cond:"Arrêt travail pour s'occuper du proche",dossier:"CPAM",ok:true},{nom:"Crédit d'impôt aidant",montant:"jusqu'à 1 200€/an",cond:"Frais aide à domicile",dossier:"Déclaration fiscale",ok:true},{nom:"PCH – Prestation Compensation Handicap",montant:"jusqu'à 1 800€/mois",cond:"Moins de 60 ans, handicap reconnu",dossier:"MDPH",ok:false}];
const ZARIT_Q=["Vous sentez-vous débordé(e) par les soins ?","Manquez-vous de temps pour vous ?","Êtes-vous stressé(e) par votre rôle ?","Votre santé se dégrade-t-elle ?","Avez-vous renoncé à des activités sociales ?","Y a-t-il des conflits familiaux ?","Avez-vous perdu le contrôle de votre vie ?","Souhaiteriez-vous confier votre proche ?"];
const NAV=[{id:"dashboard",icon:"⊞",label:"Tableau de bord"},{id:"dossier",icon:"◈",label:"Dossier médical"},{id:"agenda",icon:"◷",label:"Agenda"},{id:"medicaments",icon:"◎",label:"Médicaments"},{id:"journal",icon:"◐",label:"Journal de bord"},{id:"aides",icon:"◊",label:"Aides financières"},{id:"bienetre",icon:"♡",label:"Bien-être"},{id:"parametres",icon:"⊙",label:"Paramètres"}];
const LANGS={fr:{flag:"🇫🇷",nm:"Français",hello:"Bonjour",wel:"Comment vous sentez-vous ?",m:"💊 Mes médicaments",r:"📅 Mon rendez-vous",msg:"💬 Message famille",back:"← Retour",confirm:"Confirmer",confirmed:"✓ Confirmé !",nrdv:"Prochain RDV",nordv:"Aucun RDV",send:"Envoyer",mph:"Écrivez votre message…",msent:"✓ Envoyé !",choose:"Choisir la langue",good:"Je vais bien 😊",ok:"Ça va 😐",bad:"Je ne vais pas bien 😔",how:"Comment vous sentez-vous ?",lang:"🌍 Langue"},ar:{flag:"🇲🇦",nm:"العربية",hello:"مرحباً",wel:"كيف حالك؟",m:"💊 دوائي",r:"📅 موعدي",msg:"💬 رسالة لعائلتي",back:"→ رجوع",confirm:"تأكيد",confirmed:"✓ تم!",nrdv:"الموعد القادم",nordv:"لا موعد",send:"إرسال",mph:"اكتب رسالتك…",msent:"✓ تم!",choose:"اختر لغتك",good:"أشعر بتحسن 😊",ok:"لا بأس 😐",bad:"لا أشعر بالتحسن 😔",how:"كيف تشعر؟",lang:"🌍 اللغة"},pt:{flag:"🇵🇹",nm:"Português",hello:"Olá",wel:"Como se sente?",m:"💊 Medicamentos",r:"📅 Consulta",msg:"💬 Mensagem família",back:"← Voltar",confirm:"Confirmar",confirmed:"✓ Confirmado!",nrdv:"Próxima consulta",nordv:"Sem consulta",send:"Enviar",mph:"Escreva a mensagem…",msent:"✓ Enviado!",choose:"Escolha idioma",good:"Sinto-me bem 😊",ok:"Estou bem 😐",bad:"Não me sinto bem 😔",how:"Como se sente?",lang:"🌍 Idioma"},en:{flag:"🇬🇧",nm:"English",hello:"Hello",wel:"How do you feel?",m:"💊 Medications",r:"📅 Appointment",msg:"💬 Message family",back:"← Back",confirm:"Confirm dose",confirmed:"✓ Confirmed!",nrdv:"Next appointment",nordv:"No appointment",send:"Send",mph:"Write your message…",msent:"✓ Sent!",choose:"Choose language",good:"I feel good 😊",ok:"I'm okay 😐",bad:"I don't feel well 😔",how:"How do you feel?",lang:"🌍 Language"}};

// ═══════════════════════════════════
// APP ROOT
// ═══════════════════════════════════
function App() {
  const [screen, setScreen] = useState('loading');
  const [user, setUser] = useState(null);
  const [session, setSession] = useState(null);
  const [showTerms, setShowTerms] = useState(false);

  useEffect(() => {
    const s = getS();
    if (s && s.access_token) {
      setSession(s); setUser(s.user);
      setScreen(s.user?.email_confirmed_at || s.user?.confirmed_at ? 'app' : 'verify');
    } else { setScreen('auth'); }
  }, []);

  function onLogin(s) {
    saveS(s); setSession(s); setUser(s.user);
    setScreen(s.user?.email_confirmed_at || s.user?.confirmed_at ? 'app' : 'verify');
  }

  async function onOut() {
    if (session?.access_token) await sbSignOut(session.access_token);
    saveS(null); setSession(null); setUser(null); setScreen('auth');
  }

  if (screen === 'loading') return <Loader/>;
  if (screen === 'verify') return <Verify email={user?.email} onBack={() => { saveS(null); setScreen('auth'); }}/>;
  if (screen === 'app') {
    const role = user?.user_metadata?.role || 'aidant';
    if (role === 'patient') return <PatientApp user={user} onOut={onOut}/>;
    if (role === 'soignant') return <SoignantApp user={user} onOut={onOut}/>;
    return <AidantApp user={user} onOut={onOut}/>;
  }
  return <AuthScreen onLogin={onLogin} showTerms={showTerms} setShowTerms={setShowTerms}/>;
}

function Loader() {
  return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)'}}>
    <div style={{textAlign:'center'}}>
      <div style={{width:48,height:48,background:'linear-gradient(135deg,#1D55E8,#137A3A)',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,margin:'0 auto 14px'}}>🤝</div>
      <div style={{fontFamily:"'Syne',sans-serif",fontSize:19,fontWeight:800,marginBottom:10}}>AidantPro</div>
      <div className="spin" style={{margin:'0 auto',borderColor:'var(--bl2)',borderTopColor:'var(--bl)'}}/>
    </div>
  </div>;
}

// ═══════════════════════════════════
// AUTH
// ═══════════════════════════════════
function AuthScreen({onLogin, showTerms, setShowTerms}) {
  const [tab, setTab] = useState('login');
  const [loading, setLoading] = useState(false);
  const [alert, setAlert] = useState(null);
  const [lE, setLE] = useState(''); const [lP, setLP] = useState(''); const [showLP, setShowLP] = useState(false);
  const [rPr, setRPr] = useState(''); const [rN, setRN] = useState(''); const [rE, setRE] = useState('');
  const [rP, setRP] = useState(''); const [rP2, setRP2] = useState(''); const [showRP, setShowRP] = useState(false);
  const [role, setRole] = useState('aidant'); const [terms, setTerms] = useState(false);
  const [resetE, setResetE] = useState(''); const [resetOk, setResetOk] = useState(false);
  const ps = pwdS(rP);

  async function doLogin(e) {
    e.preventDefault(); setAlert(null);
    if (!vEmail(lE)){setAlert({t:'aerr',m:'Email invalide'});return;}
    if (!lP){setAlert({t:'aerr',m:'Mot de passe requis'});return;}
    if (!rateOk(lE)){setAlert({t:'aerr',m:'Trop de tentatives. Attendez 15 min.'});return;}
    setLoading(true);
    const d = await sbSignIn(lE.trim().toLowerCase(), lP).catch(()=>({error:{message:'Erreur réseau'}}));
    setLoading(false);
    if (!d.access_token) {
      const msgs={'Invalid login credentials':'Email ou mot de passe incorrect','Email not confirmed':'Confirmez votre email d\'abord'};
      setAlert({t:'aerr',m:msgs[d.error?.message]||d.error?.message||'Erreur de connexion'});
    } else { onLogin(d); }
  }

  async function doRegister(e) {
    e.preventDefault(); setAlert(null);
    if (!rPr.trim()){setAlert({t:'aerr',m:'Prénom requis'});return;}
    if (!vEmail(rE)){setAlert({t:'aerr',m:'Email invalide'});return;}
    if (ps.score < 3){setAlert({t:'aerr',m:'Mot de passe trop faible'});return;}
    if (rP !== rP2){setAlert({t:'aerr',m:'Mots de passe différents'});return;}
    if (!terms){setAlert({t:'aerr',m:"Acceptez les conditions"});return;}
    setLoading(true);
    const d = await sbSignUp(rE.trim().toLowerCase(), rP, clean(rPr), clean(rN), role).catch(()=>({error:{message:'Erreur réseau'}}));
    setLoading(false);
    if (d.error && !d.id) {
      const msgs={'User already registered':'Un compte existe déjà avec cet email'};
      setAlert({t:'aerr',m:msgs[d.error?.message]||d.error?.message||'Erreur création compte'});
    } else if (d.session) {
      onLogin(d.session);
    } else {
      setAlert({t:'aok',m:'✓ Compte créé ! Vérifiez votre email pour confirmer.'});
    }
  }

  async function doReset(e) {
    e.preventDefault();
    if (!vEmail(resetE)){setAlert({t:'aerr',m:'Email invalide'});return;}
    setLoading(true); await sbResetPwd(resetE); setLoading(false); setResetOk(true);
  }

  return (
    <div className="auth-wrap">
      <div className="auth-left">
        <div className="al-logo"><div className="al-ic">🤝</div><span className="al-nm">AidantPro</span></div>
        <div className="al-body">
          <h1 className="al-h">Coordonnez les soins de votre proche en toute sécurité</h1>
          <p className="al-sub">La plateforme qui réunit famille, patient et soignants autour d'un dossier médical partagé et sécurisé.</p>
          <div className="al-stats">
            <div className="al-stat"><span className="al-stat-ic">🔒</span><div className="al-stat-txt"><strong>Données chiffrées AES-256</strong> · Hébergées en Europe · RGPD</div></div>
            <div className="al-stat"><span className="al-stat-ic">👨‍👩‍👧</span><div className="al-stat-txt"><strong>11 millions d'aidants</strong> sans outil adapté en France</div></div>
            <div className="al-stat"><span className="al-stat-ic">💰</span><div className="al-stat-txt"><strong>12 000€/an</strong> d'aides non réclamées par famille</div></div>
          </div>
        </div>
        <p className="al-ft">© 2026 AidantPro · Hébergé en Europe 🇪🇺</p>
      </div>

      <div className="auth-right">
        <div className="auth-right-in">
          <div className="mob-logo"><div className="mob-ic">🤝</div><span className="mob-nm">AidantPro</span></div>
          {tab !== 'reset' && <>
            <h1 className="auth-h">{tab==='login'?'Connexion':'Créer un compte'}</h1>
            <p className="auth-sub">{tab==='login'?'Accédez à votre espace sécurisé':'Rejoignez AidantPro — 14 jours gratuits'}</p>
            <div className="tabs">
              <button className={'tab '+(tab==='login'?'on':'')} onClick={()=>{setTab('login');setAlert(null);}}>Connexion</button>
              <button className={'tab '+(tab==='register'?'on':'')} onClick={()=>{setTab('register');setAlert(null);}}>Inscription</button>
            </div>
          </>}
          {alert && <div className={'alert '+alert.t}><span>{alert.t==='aerr'?'⊘':'✓'}</span><div>{alert.m}</div></div>}

          {tab==='login' && <form onSubmit={doLogin}>
            <div className="fg"><label className="fl">Email</label>
              <div className="fi-w"><input className={'fi '+(lE&&!vEmail(lE)?'ferr':lE&&vEmail(lE)?'fok':'')} type="email" placeholder="marie@email.fr" value={lE} onChange={e=>setLE(e.target.value)} autoComplete="email" required/>
              {lE&&<span className="fi-ic">{vEmail(lE)?'✓':'⊘'}</span>}</div></div>
            <div className="fg"><label className="fl" style={{display:'flex',justifyContent:'space-between'}}>Mot de passe <button type="button" className="flink" onClick={()=>{setTab('reset');setAlert(null);}}>Oublié ?</button></label>
              <div className="fi-w"><input className="fi" type={showLP?'text':'password'} placeholder="••••••••" value={lP} onChange={e=>setLP(e.target.value)} autoComplete="current-password" style={{paddingRight:38}} required/>
              <button type="button" className="eye" onClick={()=>setShowLP(!showLP)}>{showLP?'🙈':'👁️'}</button></div></div>
            <button className="auth-btn" type="submit" disabled={loading}>{loading?<><span className="spin"/>Connexion…</>:'Se connecter →'}</button>
          </form>}

          {tab==='register' && <form onSubmit={doRegister}>
            <div className="g2">
              <div><label className="fl">Prénom *</label><input className="fi" placeholder="Marie" value={rPr} onChange={e=>setRPr(e.target.value)} required/></div>
              <div><label className="fl">Nom</label><input className="fi" placeholder="Dupont" value={rN} onChange={e=>setRN(e.target.value)}/></div>
            </div>
            <div className="fg"><label className="fl">Email *</label>
              <div className="fi-w"><input className={'fi '+(rE&&!vEmail(rE)?'ferr':rE&&vEmail(rE)?'fok':'')} type="email" placeholder="marie@email.fr" value={rE} onChange={e=>setRE(e.target.value)} required/>
              {rE&&<span className="fi-ic">{vEmail(rE)?'✓':'⊘'}</span>}</div></div>
            <div className="fg"><label className="fl">Votre rôle *</label>
              <div className="roles">
                {[['aidant','👩‍👧','Aidant','Famille'],['patient','👴','Patient','Proche aidé'],['soignant','👨‍⚕️','Soignant','Pro santé']].map(([v,ic,nm,ds])=>(
                  <div key={v} className={'role-opt '+(role===v?'sel':'')} onClick={()=>setRole(v)}>
                    <div className="role-opt-ic">{ic}</div><div className="role-opt-nm">{nm}</div><div className="role-opt-ds">{ds}</div>
                  </div>
                ))}
              </div>
            </div>
            <div className="fg"><label className="fl">Mot de passe *</label>
              <div className="fi-w"><input className="fi" type={showRP?'text':'password'} placeholder="Min. 8 caractères" value={rP} onChange={e=>setRP(e.target.value)} style={{paddingRight:38}} required/>
              <button type="button" className="eye" onClick={()=>setShowRP(!showRP)}>{showRP?'🙈':'👁️'}</button></div>
              {rP&&<><div className="pwd-bars">{[1,2,3,4].map(i=><div key={i} className={'pwd-bar '+(i<=ps.score?'s'+ps.score:'')}/>)}</div>
              <div className="pwd-reqs">{[['a','8 car. min'],['b','Majuscule'],['c','Chiffre'],['d','Spécial']].map(([k,l])=><div key={k} className={'req '+(ps.c[k]?'ok':'')}><div className="req-dot"/>{l}</div>)}</div></>}
            </div>
            <div className="fg"><label className="fl">Confirmer le mot de passe *</label>
              <div className="fi-w"><input className={'fi '+(rP2&&rP!==rP2?'ferr':rP2&&rP===rP2?'fok':'')} type="password" placeholder="Répétez" value={rP2} onChange={e=>setRP2(e.target.value)} style={{paddingRight:38}} required/>
              {rP2&&<span className="fi-ic">{rP===rP2?'✓':'⊘'}</span>}</div>
              {rP2&&rP!==rP2&&<div className="errmsg">⊘ Mots de passe différents</div>}</div>
            <div className="cb-row" onClick={()=>setTerms(!terms)}>
              <div className={'cb '+(terms?'on':'')}>{terms&&<span style={{color:'#fff',fontSize:9,fontWeight:700}}>✓</span>}</div>
              <span className="cb-lbl">J'accepte les <span style={{color:'var(--bl)',cursor:'pointer'}} onClick={e=>{e.stopPropagation();setShowTerms(true);}}>conditions d'utilisation</span> et la politique RGPD</span>
            </div>
            <button className="auth-btn" type="submit" disabled={loading||!terms}>{loading?<><span className="spin"/>Création…</>:'Créer mon compte →'}</button>
          </form>}

          {tab==='reset' && <div>
            <button className="flink" style={{display:'flex',alignItems:'center',gap:6,marginBottom:18,fontSize:13}} onClick={()=>{setTab('login');setAlert(null);setResetOk(false);}}>← Retour</button>
            <h1 className="auth-h">Mot de passe oublié</h1>
            <p className="auth-sub">Entrez votre email — nous envoyons un lien de réinitialisation.</p>
            {resetOk?<div className="alert aok">✓ Email envoyé ! Vérifiez votre boîte mail.</div>:
            <form onSubmit={doReset}>
              <div className="fg"><label className="fl">Email</label><input className="fi" type="email" placeholder="marie@email.fr" value={resetE} onChange={e=>setResetE(e.target.value)} required/></div>
              <button className="auth-btn" type="submit" disabled={loading}>{loading?<><span className="spin"/>Envoi…</>:'Envoyer le lien →'}</button>
            </form>}
          </div>}

          <div className="sec-box"><span>🔒</span><div className="sec-txt"><strong>Connexion sécurisée.</strong> Données chiffrées AES-256, hébergées en Europe, conformité RGPD.</div></div>
        </div>
      </div>

      {showTerms&&<div className="modal-bg" onClick={()=>setShowTerms(false)}>
        <div className="modal" onClick={e=>e.stopPropagation()}>
          <h2>Conditions d'utilisation</h2>
          <p><strong>1. Objet</strong><br/>AidantPro est une plateforme de coordination de soins pour aidants familiaux, patients et professionnels.</p>
          <p><strong>2. RGPD</strong><br/>Vos données sont chiffrées AES-256, hébergées dans l'UE. Droit d'accès, rectification et suppression garantis.</p>
          <p><strong>3. Usage</strong><br/>AidantPro ne remplace pas un avis médical professionnel.</p>
          <p><strong>4. Abonnement</strong><br/>14 jours gratuits sans carte bancaire. Annulable à tout moment.</p>
          <button className="modal-close" onClick={()=>setShowTerms(false)}>Fermer</button>
        </div>
      </div>}
    </div>
  );
}

function PatientApp({user, onOut}) {
  const [lang, setLang] = useState('fr');
  const [screen, setScreen] = useState('home');
  const [meds, setMeds] = useState(MEDS_INIT);
  const [msg, setMsg] = useState(''); const [msgSent, setMsgSent] = useState(false);
  const [feel, setFeel] = useState(null);
  const today = new Date().toISOString().split('T')[0];
  const t = LANGS[lang] || LANGS.fr;
  const dir = lang === 'ar' ? 'rtl' : 'ltr';
  const prenom = user?.user_metadata?.prenom || 'Pierre';
  const pr = RDV_INIT.filter(r=>!r.fait).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const pris = meds.reduce((a,m)=>a+m.horaires.filter(h=>m.prises[today+'_'+h]).length,0);
  const tot = meds.reduce((a,m)=>a+m.horaires.length,0);
  function tp(id,h){const k=today+'_'+h;setMeds(p=>p.map(m=>m.id!==id?m:{...m,prises:{...m.prises,[k]:!m.prises[k]}}));}

  if (screen==='lang') return <div className="pat" dir={dir}>
    <div className="sub-hd"><button className="back-btn" onClick={()=>setScreen('home')}>{t.back}</button><div className="sub-title">{t.choose}</div></div>
    <div className="sub-body"><div className="lang-grid">{Object.entries(LANGS).map(([k,v])=><div key={k} className={'lang-card '+(lang===k?'lsel':'')} onClick={()=>{setLang(k);setScreen('home');}}><span className="lang-flag">{v.flag}</span><span className="lang-nm">{v.nm}</span></div>)}</div></div>
  </div>;

  if (screen==='meds') return <div className="pat" dir={dir}>
    <div className="sub-hd"><button className="back-btn" onClick={()=>setScreen('home')}>{t.back}</button><div className="sub-title">💊</div></div>
    <div className="sub-body">{meds.map(m=><div key={m.id} className="med-card"><div className="med-nm">💊 {m.nom}</div><div className="med-dose">{m.dose} — {m.indication}</div><div className="med-btns">{m.horaires.map(h=>{const ok=!!m.prises[today+'_'+h];return <button key={h} className={'med-btn '+(ok?'ok':'')} onClick={()=>tp(m.id,h)}>{h} {ok?t.confirmed:t.confirm}</button>;})}</div></div>)}</div>
  </div>;

  if (screen==='rdv') return <div className="pat" dir={dir}>
    <div className="sub-hd"><button className="back-btn" onClick={()=>setScreen('home')}>{t.back}</button><div className="sub-title">📅</div></div>
    <div className="sub-body">{pr?<div className="rdv-card"><div className="rdv-date">{pr.date.split('-')[2]}</div><div className="rdv-mo">{new Date(pr.date+'T12:00').toLocaleString('fr-FR',{month:'long',year:'numeric'})}</div><div className="rdv-ti">{pr.titre}</div><div className="rdv-li">📍 {pr.lieu}</div><div className="rdv-hr">🕐 {pr.heure}</div></div>:<div style={{textAlign:'center',padding:'36px',fontSize:17,color:'var(--mu)'}}>{t.nordv}</div>}</div>
  </div>;

  if (screen==='msg') return <div className="pat" dir={dir}>
    <div className="sub-hd"><button className="back-btn" onClick={()=>{setScreen('home');setMsgSent(false);setMsg('');}}>{t.back}</button><div className="sub-title">💬</div></div>
    <div className="sub-body">{msgSent?<div className="msg-sent">{t.msent}</div>:<><div className="msg-box"><textarea className="msg-ta" placeholder={t.mph} value={msg} onChange={e=>setMsg(e.target.value)}/></div><button className="msg-send" onClick={()=>{if(msg.trim())setMsgSent(true);}}>{t.send} →</button></>}</div>
  </div>;

  return <div className="pat" dir={dir}>
    <div className="pat-hd">
      <div className="pat-hd-logo"><div className="pat-hd-ic">🤝</div><div className="pat-hd-nm">AidantPro</div></div>
      <div className="fxs"><button className="pat-hd-btn" onClick={()=>setScreen('lang')}>{t.lang}</button><button className="pat-hd-btn" onClick={onOut}>←</button></div>
    </div>
    <div className="pat-body">
      <div className="pat-hello">{t.hello}, {prenom} 👋</div>
      <div className="pat-sub">{t.wel}</div>
      <div className="pat-btns">
        <button className="pb pb-m" onClick={()=>setScreen('meds')}><div className="pb-ic">💊</div><div><div className="pb-tx">{t.m}</div><div className="pb-sub">{pris}/{tot} confirmés</div></div></button>
        <button className="pb pb-r" onClick={()=>setScreen('rdv')}><div className="pb-ic">📅</div><div><div className="pb-tx">{t.r}</div><div className="pb-sub">{pr?pr.date.split('-')[2]+' — '+pr.heure:t.nordv}</div></div></button>
        <button className="pb pb-msg" onClick={()=>setScreen('msg')}><div className="pb-ic">💬</div><div><div className="pb-tx">{t.msg}</div><div className="pb-sub">Famille...</div></div></button>
      </div>
      <div style={{fontSize:14,fontWeight:600,color:'var(--mu)',marginTop:22,marginBottom:10,textAlign:'center'}}>{t.how}</div>
      <div className="feel-row">{[['good',t.good],['ok',t.ok],['bad',t.bad]].map(([k,l])=><button key={k} className={'feel-btn '+(feel===k?'fsel':'')} onClick={()=>setFeel(k)}>{l}</button>)}</div>
    </div>
  </div>;
}

// AIDANT INTERFACE
// ═══════════════════════════════════
function AidantApp({user, onOut}) {
  const [page, setPage] = useState('dashboard');
  const [proche, setProche] = useState({prenom:'Pierre',nom:'Dubois',age:78,groupeSanguin:'A+',pathologies:["Maladie d'Alzheimer (stade modéré)","Hypertension","Diabète type 2"],allergies:["Pénicilline","Aspirine"],mutuelle:'MGEN',adresse:'12 rue des Lilas, Paris',medecins:[{id:1,nom:'Dr. Martin Sophie',spec:'Médecin traitant',tel:'04 76 00 12 34'},{id:2,nom:'Dr. Benali Karim',spec:'Neurologue',tel:'04 76 45 67 89'}]});
  const [meds, setMeds] = useState(MEDS_INIT);
  const [rdvs, setRdvs] = useState(RDV_INIT);
  const [journal, setJournal] = useState(JOURNAL_INIT);
  const [zarit, setZarit] = useState({});
  const [aiTxt, setAiTxt] = useState(''); const [aiLoad, setAiLoad] = useState(false);
  const today = new Date().toISOString().split('T')[0];
  const pris = meds.reduce((a,m)=>a+m.horaires.filter(h=>m.prises[today+'_'+h]).length,0);
  const tot = meds.reduce((a,m)=>a+m.horaires.length,0);
  const zScore = Object.values(zarit).reduce((a,b)=>a+b,0);
  const zPct = ZARIT_Q.length ? Math.round((zScore/(ZARIT_Q.length*4))*100) : 0;
  const zColor = zPct<30?'var(--gn)':zPct<60?'var(--am)':'var(--rd)';
  const prenom = user?.user_metadata?.prenom || 'Marie';
  function tp(id,h){const k=today+'_'+h;setMeds(p=>p.map(m=>m.id!==id?m:{...m,prises:{...m.prises,[k]:!m.prises[k]}}));}
  const alerts=[...meds.filter(m=>m.renouv<=10).map(m=>({t:'w',m:`Renouvellement ${m.nom} dans ${m.renouv} jours`})),...rdvs.filter(r=>!r.fait&&!r.assigne).map(r=>({t:'d',m:`RDV non assigné : ${r.titre}`}))];

  async function genAI(){
    setAiLoad(true);setAiTxt('');
    try{
      const ctx=journal.slice(0,3).map(j=>`${j.date}: ${j.contenu}`).join('\n');
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:`Résumé clinique factuel 3-4 phrases pour médecin traitant:\n${ctx}\nPatient: ${proche.prenom} ${proche.nom}, ${proche.age} ans. Pathologies: ${proche.pathologies.join(', ')}.`}]})});
      const d=await r.json();
      setAiTxt(d.content?.[0]?.text||'Erreur.');
    }catch{setAiTxt('Erreur de connexion.');}
    setAiLoad(false);
  }

  const P = {proche,setProche,meds,setMeds,rdvs,setRdvs,journal,setJournal,zarit,setZarit,zPct,zColor,aiTxt,aiLoad,genAI,today,tp,pris,tot,alerts,setPage,prenom};

  return <div className="app">
    <aside className="sb">
      <div className="sb-hd"><div className="sb-logo"><div className="sb-logo-ic">A</div><span className="sb-logo-nm">AidantPro</span></div></div>
      <div className="pc" onClick={()=>setPage('dossier')}><div className="pc-n">{proche.prenom} {proche.nom}</div><div className="pc-s">{proche.age} ans · Alzheimer</div></div>
      <nav style={{padding:'5px 7px',flex:1,overflowY:'auto'}}>
        {NAV.map(n=><button key={n.id} className={'ni '+(page===n.id?'on':'')} onClick={()=>setPage(n.id)}><span className="ni-ic">{n.icon}</span><span className="ni-lb">{n.label}</span></button>)}
      </nav>
      <button className="sb-sw" onClick={onOut}>⇄ Déconnexion</button>
      <div className="sb-ft">Bonjour <strong>{prenom}</strong> · Plan Famille</div>
    </aside>
    <main className="main">
      {page==='dashboard'&&<DB {...P}/>}
      {page==='dossier'&&<Dossier {...P}/>}
      {page==='agenda'&&<Agenda rdvs={rdvs} setRdvs={setRdvs}/>}
      {page==='medicaments'&&<Medicaments meds={meds} setMeds={setMeds} today={today} tp={tp} pris={pris} tot={tot}/>}
      {page==='journal'&&<Journal journal={journal} setJournal={setJournal} today={today} aiTxt={aiTxt} aiLoad={aiLoad} genAI={genAI}/>}
      {page==='aides'&&<Aides/>}
      {page==='bienetre'&&<Bienetre zarit={zarit} setZarit={setZarit} zPct={zPct} zColor={zColor}/>}
      {page==='parametres'&&<Params prenom={prenom} onOut={onOut}/>}
    </main>
  </div>;
}

    {alerts.map((a,i)=><div key={i} className={'al al-'+(a.t==='w'?'w':'d')}><span>{a.t==='w'?'⚠':'⊘'}</span>{a.m}</div>)}
    {aiTxt&&<div className="ai-box"><div className="ai-lbl">Résumé IA — pour le médecin</div><div className="ai-txt">{aiTxt}</div></div>}
    <div className="g4">
      <div className="kpi"><div className="kv">{pris}<span style={{fontSize:16,fontWeight:400,color:'var(--mu)'}}>/{{tot}}</span></div><div className="kl">Prises confirmées</div></div>
      <div className="kpi"><div className="kv">{rdvs.filter(r=>!r.fait).length}</div><div className="kl">RDV à venir</div></div>
      <div className="kpi"><div className="kv">{journal.length}</div><div className="kl">Notes journal</div></div>
      <div className="kpi" style={{background:'var(--bl2)',cursor:'pointer'}} onClick={()=>setPage('aides')}><div className="kv" style={{color:'var(--bl)'}}>{AIDES.filter(a=>a.ok).length}</div><div className="kl" style={{color:'var(--bl)'}}>Aides →</div></div>
    </div>
    <div className="g2">
      <div className="card" style={{cursor:'pointer'}} onClick={()=>setPage('agenda')}>
        <div className="ct">Prochain RDV</div>
        {pr?<div style={{display:'flex',gap:10}}><div className="rd-dt" style={{background:'var(--bl2)'}}><div className="rd-day" style={{color:'var(--bl)'}}>{pr.date.split('-')[2]}</div><div className="rd-mo" style={{color:'var(--bl)'}}>{new Date(pr.date+'T12:00').toLocaleString('fr-FR',{month:'short'})}</div><div style={{fontSize:10,color:'var(--mu)',marginTop:2}}>{pr.heure}</div></div><div><div style={{fontSize:13,fontWeight:600,marginBottom:3}}>{pr.titre}</div><div style={{fontSize:11,color:'var(--mu)'}}>{pr.lieu}</div></div></div>:<div className="empty">Aucun RDV</div>}
      </div>
      <div className="card" style={{cursor:'pointer'}} onClick={()=>setPage('journal')}>
        <div className="ct">Dernière note</div>
        {journal[0]?<><div style={{fontSize:12,lineHeight:1.75,marginBottom:8}}>{journal[0].contenu.slice(0,100)}…</div><span className={'badge '+(journal[0].humeur==='bien'?'b-gn':journal[0].humeur==='moyen'?'b-am':'b-rd')}>{journal[0].humeur}</span></>:<div className="empty">Aucune note</div>}
      </div>
    </div>
    <div className="card">
      <div className="fxb"><div className="ct" style={{marginBottom:0}}>Médicaments du jour</div><span style={{fontSize:10,color:'var(--mu)'}}>{pris}/{tot}</span></div>
      <div className="sbar" style={{margin:'8px 0 12px'}}><div className="sfill" style={{width:`${tot?(pris/tot)*100:0}%`,background:pris===tot?'var(--gn)':'var(--bl)'}}/></div>
      {meds.map(m=><div key={m.id} className="mr"><div><div className="mn">{m.nom} <span style={{fontWeight:400,color:'var(--mu)',fontSize:12}}>{m.dose}</span></div>{m.renouv<=10&&<div style={{fontSize:10,color:'var(--am)'}}>⚠ J-{m.renouv}</div>}</div><div className="hg">{m.horaires.map(h=>{const ok=!!m.prises[today+'_'+h];return<button key={h} className={'hb '+(ok?'ok':'')} onClick={()=>tp(m.id,h)}>{h} {ok?'✓':'○'}</button>;})}</div></div>)}
    </div>
  </>;

function Dossier({proche,setProche,aiTxt,aiLoad,genAI}){
  const [edit,setEdit]=useState(false);const [ed,setEd]=useState({...proche});
  const [np,setNp]=useState('');const [na,setNa]=useState('');
  function save(){setProche({...ed});setEdit(false);}
  function addTag(f,v,sv){if(!v.trim())return;setProche(p=>({...p,[f]:[...p[f],v.trim()]}));sv('');}
  function rmTag(f,i){setProche(p=>({...p,[f]:p[f].filter((_,idx)=>idx!==i)}));}
  return <>
    <div className="ph"><div><div className="pt">Dossier médical</div><div className="ps">{proche.prenom} {proche.nom} · {proche.age} ans</div></div><div className="fxs"><button className="btn bg2" onClick={genAI} disabled={aiLoad}>{aiLoad?<><span className="spin2"/>…</>:'Résumé IA'}</button><button className="btn bs" onClick={()=>{setEdit(!edit);setEd({...proche});}}>{edit?'Annuler':'Modifier'}</button></div></div>
    {aiTxt&&<div className="ai-box"><div className="ai-lbl">Résumé IA — pour le médecin</div><div className="ai-txt">{aiTxt}</div></div>}
    <div className="g2">
      <div className="gap-b">
        <div className="card"><div className="ct">Informations</div>
          {edit?<><div className="g2"><div className="fg"><label className="fl">Prénom</label><input className="fi" value={ed.prenom} onChange={e=>setEd({...ed,prenom:e.target.value})}/></div><div className="fg"><label className="fl">Nom</label><input className="fi" value={ed.nom} onChange={e=>setEd({...ed,nom:e.target.value})}/></div><div className="fg"><label className="fl">Groupe sanguin</label><input className="fi" value={ed.groupeSanguin} onChange={e=>setEd({...ed,groupeSanguin:e.target.value})}/></div><div className="fg"><label className="fl">Mutuelle</label><input className="fi" value={ed.mutuelle} onChange={e=>setEd({...ed,mutuelle:e.target.value})}/></div></div><div className="fxs"><button className="btn bp" onClick={save}>Enregistrer</button><button className="btn bs" onClick={()=>setEdit(false)}>Annuler</button></div></>:
          <><div className="ir"><span className="ik">Nom</span><span className="iv">{proche.prenom} {proche.nom}</span></div><div className="ir"><span className="ik">Âge</span><span className="iv">{proche.age} ans</span></div><div className="ir"><span className="ik">Groupe sanguin</span><span className="iv"><span className="badge b-rd">{proche.groupeSanguin}</span></span></div><div className="ir"><span className="ik">Mutuelle</span><span className="iv" style={{fontSize:11}}>{proche.mutuelle}</span></div></>}
        </div>
        <div className="card"><div className="ct">Pathologies</div>
          <div style={{marginBottom:8}}>{proche.pathologies.map((p,i)=><span key={i} className="tag-i" style={{background:'var(--am2)',color:'var(--am)'}}>{p}<button className="tag-rm" onClick={()=>rmTag('pathologies',i)}>×</button></span>)}</div>
          <div className="fxs"><input className="fi" style={{flex:1,fontSize:11}} placeholder="Ajouter…" value={np} onChange={e=>setNp(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTag('pathologies',np,setNp)}/><button className="btn bp" style={{padding:'5px 10px'}} onClick={()=>addTag('pathologies',np,setNp)}>+</button></div>
        </div>
        <div className="card"><div className="ct">Allergies</div>
          <div style={{marginBottom:8}}>{proche.allergies.map((a,i)=><span key={i} className="tag-i" style={{background:'var(--rd2)',color:'var(--rd)'}}>{a}<button className="tag-rm" onClick={()=>rmTag('allergies',i)}>×</button></span>)}</div>
          <div className="fxs"><input className="fi" style={{flex:1,fontSize:11}} placeholder="Ajouter…" value={na} onChange={e=>setNa(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTag('allergies',na,setNa)}/><button className="btn br2" style={{padding:'5px 10px'}} onClick={()=>addTag('allergies',na,setNa)}>+</button></div>
        </div>
      </div>
      <div className="card"><div className="ct">Équipe médicale</div>
        {proche.medecins.map(m=><div key={m.id} style={{padding:'10px 0',borderBottom:'1px solid var(--bd)'}}><div style={{fontSize:13,fontWeight:600,marginBottom:2}}>{m.nom}</div><span className="badge b-bl">{m.spec}</span><div style={{fontSize:11,color:'var(--mu)',marginTop:5}}>📞 {m.tel}</div></div>)}
        <div className="ir mt8"><span className="ik">Urgences</span><span className="iv" style={{color:'var(--rd)',fontWeight:700}}>SAMU 15</span></div>
      </div>
    </div>
  </>;
}

function Agenda({rdvs,setRdvs}){
  const [show,setShow]=useState(false);const [nr,setNr]=useState({titre:'',date:'',heure:'',lieu:'',assigne:'',notes:''});
  function add(){if(!nr.titre||!nr.date)return;setRdvs(p=>[...p,{...nr,id:Date.now(),fait:false}].sort((a,b)=>a.date.localeCompare(b.date)));setNr({titre:'',date:'',heure:'',lieu:'',assigne:'',notes:''});setShow(false);}
  const av=rdvs.filter(r=>!r.fait);
  return <>
    <div className="ph"><div><div className="pt">Agenda médical</div><div className="ps">{av.length} rendez-vous à venir</div></div><button className="btn bp" onClick={()=>setShow(!show)}>+ Nouveau RDV</button></div>
    {show&&<div className="card"><div className="ct">Nouveau RDV</div><div className="g2"><div className="fg"><label className="fl">Titre</label><input className="fi" value={nr.titre} onChange={e=>setNr({...nr,titre:e.target.value})}/></div><div className="fg"><label className="fl">Date</label><input className="fi" type="date" value={nr.date} onChange={e=>setNr({...nr,date:e.target.value})}/></div><div className="fg"><label className="fl">Heure</label><input className="fi" value={nr.heure} onChange={e=>setNr({...nr,heure:e.target.value})} placeholder="14h30"/></div><div className="fg"><label className="fl">Lieu</label><input className="fi" value={nr.lieu} onChange={e=>setNr({...nr,lieu:e.target.value})}/></div></div><div className="fxs"><button className="btn bp" onClick={add}>Enregistrer</button><button className="btn bs" onClick={()=>setShow(false)}>Annuler</button></div></div>}
    {av.map(r=>{const d=new Date(r.date+'T12:00');return<div key={r.id} className="rc"><div className="rd-dt" style={{background:'var(--bl2)'}}><div className="rd-day" style={{color:'var(--bl)'}}>{r.date.split('-')[2]}</div><div className="rd-mo" style={{color:'var(--bl)'}}>{d.toLocaleString('fr-FR',{month:'short'})}</div><div style={{fontSize:10,color:'var(--mu)'}}>{r.heure}</div></div><div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,marginBottom:2}}>{r.titre}</div><div style={{fontSize:11,color:'var(--mu)',marginBottom:7}}>{r.lieu}</div><div className="fxs"><span className={'badge '+(r.assigne?'b-bl':'b-rd')}>{r.assigne||'Non assigné'}</span><button className="btn bs" style={{padding:'2px 8px',fontSize:10}} onClick={()=>setRdvs(p=>p.map(x=>x.id===r.id?{...x,fait:true}:x))}>Effectué</button><button className="btn br2" style={{padding:'2px 8px',fontSize:10}} onClick={()=>setRdvs(p=>p.filter(x=>x.id!==r.id))}>×</button></div></div></div>;})}
    {rdvs.filter(r=>r.fait).length>0&&<div style={{fontSize:10,fontWeight:600,color:'var(--mu)',textTransform:'uppercase',margin:'14px 0 6px'}}>Passés</div>}
    {rdvs.filter(r=>r.fait).map(r=><div key={r.id} className="rc" style={{opacity:.4}}><div className="rd-dt" style={{background:'var(--bg)'}}><div className="rd-day" style={{color:'var(--mu)'}}>{r.date.split('-')[2]}</div></div><div><div style={{fontSize:13,fontWeight:600,textDecoration:'line-through'}}>{r.titre}</div><span className="badge b-gn">Effectué</span></div></div>)}
  </>;
}

function Medicaments({meds,setMeds,today,tp,pris,tot}){
  const [show,setShow]=useState(false);const [nm,setNm]=useState({nom:'',dose:'',horaires:'08h00',renouv:30,indication:''});
  function add(){if(!nm.nom)return;setMeds(p=>[...p,{...nm,id:Date.now(),horaires:nm.horaires.split(',').map(h=>h.trim()),prises:{}}]);setNm({nom:'',dose:'',horaires:'08h00',renouv:30,indication:''});setShow(false);}
  return <>
    <div className="ph"><div><div className="pt">Médicaments</div><div className="ps">{pris}/{tot} prises · {meds.length} traitements</div></div><button className="btn bp" onClick={()=>setShow(!show)}>+ Ajouter</button></div>
    <div className="sbar" style={{marginBottom:14}}><div className="sfill" style={{width:`${tot?(pris/tot)*100:0}%`,background:pris===tot?'var(--gn)':'var(--bl)'}}/></div>
    {show&&<div className="card"><div className="g2"><div className="fg"><label className="fl">Nom</label><input className="fi" value={nm.nom} onChange={e=>setNm({...nm,nom:e.target.value})}/></div><div className="fg"><label className="fl">Dosage</label><input className="fi" value={nm.dose} onChange={e=>setNm({...nm,dose:e.target.value})} placeholder="500mg"/></div><div className="fg"><label className="fl">Horaires (virgules)</label><input className="fi" value={nm.horaires} onChange={e=>setNm({...nm,horaires:e.target.value})}/></div><div className="fg"><label className="fl">Indication</label><input className="fi" value={nm.indication} onChange={e=>setNm({...nm,indication:e.target.value})}/></div></div><div className="fxs"><button className="btn bp" onClick={add}>Enregistrer</button><button className="btn bs" onClick={()=>setShow(false)}>Annuler</button></div></div>}
    <div className="card">{meds.map(m=><div key={m.id} className="mr"><div style={{flex:1}}><div className="fxs" style={{flexWrap:'wrap',marginBottom:3}}><div className="mn">{m.nom}</div><span className="badge b-bl">{m.dose}</span>{m.renouv<=10&&<span className="badge b-am">J-{m.renouv}</span>}</div><div className="md">{m.indication}</div></div><div className="fxs" style={{flexDirection:'column',alignItems:'flex-end',gap:5}}><div className="hg">{m.horaires.map(h=>{const ok=!!m.prises[today+'_'+h];return<button key={h} className={'hb '+(ok?'ok':'')} onClick={()=>tp(m.id,h)}>{h} {ok?'✓':'○'}</button>;})}</div><button className="btn br2" style={{padding:'2px 7px',fontSize:10}} onClick={()=>setMeds(p=>p.filter(x=>x.id!==m.id))}>Supprimer</button></div></div>)}</div>
  </>;
}

function Journal({journal,setJournal,today,aiTxt,aiLoad,genAI}){
  const [nn,setNn]=useState({contenu:'',humeur:'bien',tension:'',auteur:'Marie'});
  function add(){if(!nn.contenu.trim())return;setJournal(p=>[{...nn,id:Date.now(),date:today},...p]);setNn({contenu:'',humeur:'bien',tension:'',auteur:'Marie'});}
  return <>
    <div className="ph"><div><div className="pt">Journal de bord</div><div className="ps">{journal.length} observations</div></div><button className="btn bg2" onClick={genAI} disabled={aiLoad}>{aiLoad?<><span className="spin2"/>…</>:'Résumé IA'}</button></div>
    {aiTxt&&<div className="ai-box"><div className="ai-lbl">Résumé IA — pour le médecin</div><div className="ai-txt">{aiTxt}</div></div>}
    <div className="card" style={{marginBottom:14}}>
      <div className="ct">Nouvelle note — {today}</div>
      <div className="fg"><textarea className="fi fta" placeholder="Comportement, humeur, médicaments, incidents…" value={nn.contenu} onChange={e=>setNn({...nn,contenu:e.target.value})}/></div>
      <div className="g2" style={{marginBottom:9}}><div className="fg"><label className="fl">Tension</label><input className="fi" value={nn.tension} onChange={e=>setNn({...nn,tension:e.target.value})} placeholder="13/8"/></div><div className="fg"><label className="fl">Auteur</label><select className="fi fsel" value={nn.auteur} onChange={e=>setNn({...nn,auteur:e.target.value})}>{['Marie','Émile','Aide domicile','Autre'].map(v=><option key={v}>{v}</option>)}</select></div></div>
      <div className="fxb"><div className="fxs">{[['bien','😊 Bien'],['moyen','😐 Moyen'],['difficile','😔 Difficile']].map(([v,l])=><button key={v} className={'btn '+(nn.humeur===v?'bp':'bs')} style={{padding:'4px 10px',fontSize:11}} onClick={()=>setNn({...nn,humeur:v})}>{l}</button>)}</div><button className="btn bp" onClick={add}>Enregistrer</button></div>
    </div>
    {journal.map(e=><div key={e.id} className={'je '+e.humeur}><div className="jm"><span className="jd">{e.date}</span><span className="ja">{e.auteur}</span><span className={'badge '+(e.humeur==='bien'?'b-gn':e.humeur==='moyen'?'b-am':'b-rd')}>{e.humeur}</span></div><div className="jc">{e.contenu}</div>{e.tension&&<span style={{fontSize:10,background:'var(--bg)',border:'1px solid var(--bd)',borderRadius:5,padding:'2px 6px',color:'var(--mu)',marginTop:6,display:'inline-block'}}>❤️ {e.tension}</span>}<button className="btn br2 mt8" style={{padding:'2px 7px',fontSize:10}} onClick={()=>setJournal(p=>p.filter(j=>j.id!==e.id))}>Supprimer</button></div>)}
  </>;
}

function Aides(){
  return <>
    <div className="ph"><div><div className="pt">Aides financières</div><div className="ps">{AIDES.filter(a=>a.ok).length} aides éligibles identifiées</div></div></div>
    <div className="al al-s">💰 Estimation : <strong>≈ 14 000€/an</strong> d'aides potentielles. La plupart des aidants ne les réclament pas.</div>
    <div style={{height:10}}/>
    <div className="g2">{AIDES.map((a,i)=><div key={i} className="ac" style={{borderColor:a.ok?'var(--gn3)':'var(--rd3)',opacity:a.ok?1:.6}}><div style={{marginBottom:7}}><span className={'badge '+(a.ok?'b-gn':'b-rd')}>{a.ok?'✓ Éligible':'✗ Non éligible'}</span></div><div className="an">{a.nom}</div><div className="am-v" style={{color:a.ok?'var(--gn)':'var(--mu)'}}>{a.montant}</div><div style={{fontSize:11,color:'var(--mu)',marginBottom:3}}>◎ {a.cond}</div><div style={{fontSize:11,color:'var(--mu)'}}>◈ {a.dossier}</div>{a.ok&&<button className="btn bp mt8" style={{width:'100%',justifyContent:'center',fontSize:11}}>Voir le formulaire →</button>}</div>)}</div>
  </>;
}

function Bienetre({zarit,setZarit,zPct,zColor}){
  const nb=Object.keys(zarit).length;
  const label=zPct<30?'Faible charge':zPct<60?'Charge modérée':'Charge élevée';
  const opts=['Jamais','Rarement','Parfois','Souvent','Toujours'];
  return <>
    <div className="ph"><div><div className="pt">Mon bien-être</div><div className="ps">Échelle de Zarit · {nb}/{ZARIT_Q.length}</div></div>{nb>0&&<button className="btn bs" onClick={()=>setZarit({})}>Réinitialiser</button>}</div>
    {nb===ZARIT_Q.length&&<div className="card"><div className="ct">Score de charge aidant</div><div style={{display:'flex',alignItems:'center',gap:14}}><div style={{flex:1}}><div className="sbar"><div className="sfill" style={{width:`${zPct}%`,background:zColor}}/></div><div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--mu)',marginTop:3}}><span>Faible</span><span>Élevée</span></div></div><div style={{textAlign:'center',minWidth:80}}><div style={{fontFamily:"'Syne',sans-serif",fontSize:30,fontWeight:800,color:zColor}}>{zPct}%</div><div style={{fontSize:12,fontWeight:600,color:zColor}}>{label}</div></div></div>{zPct>=60&&<div className="al al-d mt8">⚠ <strong>0 800 360 360</strong> — Numéro aidants gratuit 7j/7</div>}</div>}
    {ZARIT_Q.map((q,i)=><div key={i} className="zq"><div className="zt"><strong style={{color:'var(--mu)',fontSize:11}}>{i+1}.</strong> {q}</div><div className="zo">{opts.map((opt,val)=><button key={val} className={'zob '+(zarit[i]===val?'s'+val:'')} onClick={()=>setZarit(p=>({...p,[i]:val}))}>{opt}</button>)}</div></div>)}
    <div className="card mt12"><div className="ct">Ressources</div>{[{n:'Numéro aidants',v:'0 800 360 360',s:'Gratuit · 7j/7'},{n:'France Alzheimer',v:'0 811 112 112',s:'Familles'}].map((r,i)=><div key={i} className="ir"><div><div style={{fontSize:12,fontWeight:600}}>{r.n}</div><div style={{fontSize:10,color:'var(--mu)'}}>{r.s}</div></div><span className="badge b-bl">{r.v}</span></div>)}</div>
  </>;
}

function Params({prenom, onOut}){
  const [notifs,setNotifs]=useState({meds:true,rdv:true,renouv:true,urgent:true});
  return <>
    <div className="ph"><div><div className="pt">Paramètres</div><div className="ps">Profil, notifications, abonnement</div></div></div>
    <div className="g2">
      <div className="gap-b">
        <div className="card"><div className="ct">Profil</div><div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}><div style={{width:40,height:40,borderRadius:'50%',background:'var(--bl2)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:14,color:'var(--bl)'}}>{prenom.charAt(0)}</div><div><div style={{fontSize:14,fontWeight:700}}>{prenom}</div><div style={{fontSize:11,color:'var(--mu)'}}>Aidant principal</div></div></div><div className="fg"><label className="fl">Email</label><input className="fi" placeholder="votre@email.fr"/></div><button className="btn bp mt8">Enregistrer</button></div>
        <div className="card"><div className="ct">Abonnement</div><div className="ir"><span className="ik">Plan</span><span className="iv"><span className="badge b-gn">Famille · 15€/mois</span></span></div><div className="ir"><span className="ik">Données</span><span className="iv"><span className="badge b-bl">🇪🇺 Europe</span></span></div><button className="btn bs mt8" style={{fontSize:11}}>Gérer l'abonnement</button></div>
        <div className="card"><div className="ct">Session</div><button className="btn br2" style={{width:'100%',justifyContent:'center'}} onClick={onOut}>Se déconnecter</button></div>
      </div>
      <div className="card"><div className="ct">Notifications</div>{[['meds','Rappels médicaments','Prises non confirmées'],['rdv','Rappels RDV','48h et 2h avant'],['renouv','Renouvellements','15 jours avant'],['urgent','Alertes urgentes','En temps réel']].map(([k,l,s])=><div key={k} className="ir"><div><div style={{fontSize:12,fontWeight:500}}>{l}</div><div style={{fontSize:10,color:'var(--mu)'}}>{s}</div></div><div style={{position:'relative',width:36,height:20,borderRadius:10,background:notifs[k]?'var(--bl)':'var(--bd)',cursor:'pointer',transition:'background .2s',flexShrink:0}} onClick={()=>setNotifs(p=>({...p,[k]:!p[k]}))}><div style={{position:'absolute',top:2,left:notifs[k]?18:2,width:16,height:16,borderRadius:'50%',background:'#fff',transition:'left .2s',boxShadow:'0 1px 3px rgba(0,0,0,.2)'}}/></div></div>)}</div>
    </div>
  </>;
}

// ═══════════════════════════════════
// SOIGNANT INTERFACE
// ═══════════════════════════════════
function SoignantApp({user, onOut}){
  const [email,setEmail]=useState('');const [sent,setSent]=useState(false);
  return <div style={{minHeight:'100vh',background:'linear-gradient(160deg,var(--bl2),var(--gn2))',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:40,textAlign:'center'}}>
    <div style={{fontSize:60,marginBottom:18}}>👨‍⚕️</div>
    <h2 style={{fontFamily:"'Syne',sans-serif",fontSize:28,fontWeight:800,marginBottom:10}}>Interface Soignant — Bêta</h2>
    <p style={{fontSize:14,color:'var(--mu)',maxWidth:440,margin:'0 auto 28px',lineHeight:1.7}}>L'espace dédié aux médecins et professionnels de santé est en cours de finalisation. Inscrivez-vous pour y accéder en avant-première.</p>
    {sent?<div style={{fontSize:17,fontWeight:700,color:'var(--gn)',marginBottom:24}}>✓ Vous serez notifié dès l'ouverture !</div>:<div style={{display:'flex',gap:10,maxWidth:400,width:'100%',margin:'0 auto 24px'}}><input style={{flex:1,padding:'11px 14px',border:'1.5px solid var(--bd)',borderRadius:10,fontSize:13,outline:'none'}} type="email" placeholder="Email professionnel" value={email} onChange={e=>setEmail(e.target.value)}/><button style={{background:'var(--bl)',color:'#fff',border:'none',padding:'11px 18px',borderRadius:10,fontSize:13,fontWeight:600,cursor:'pointer'}} onClick={()=>{if(email.trim())setSent(true);}}>Notifier</button></div>}
    <button style={{background:'none',border:'1px solid var(--bd)',borderRadius:8,padding:'8px 16px',fontSize:12,cursor:'pointer',color:'var(--mu)'}} onClick={onOut}>← Déconnexion</button>
  </div>;
}

// ═══════════════════════════════════
// RENDU
// ═══════════════════════════════════
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
