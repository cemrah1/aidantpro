*{box-sizing:border-box;margin:0;padding:0}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

// ═══════════════════════════════════════
// CONFIGURATION
// ═══════════════════════════════════════
const SB_URL = 'https://yyfumysysdowpcnqeehs.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5ZnVteXN5c2Rvd3BjbnFlZWhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NjI0NTUsImV4cCI6MjA5NDEzODQ1NX0.jYlYaildOLYgeSZWi_khNO9UusUl6hW-CUBkYvsSyjM';
const HEADERS = {'Content-Type':'application/json','apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`};

// ═══════════════════════════════════════
// API SUPABASE — FETCH DIRECT (pas de SDK)
// ═══════════════════════════════════════
async function apiSignUp(email, password, prenom, nom, role) {
  const r = await fetch(`${SB_URL}/auth/v1/signup`, {
    method:'POST', headers:HEADERS,
    body:JSON.stringify({email, password, data:{prenom, nom, role}})
  });
  return r.json();
}

async function apiSignIn(email, password) {
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
    method:'POST', headers:HEADERS,
    body:JSON.stringify({email, password})
  });
  return r.json();
}

async function apiSignOut(token) {
  await fetch(`${SB_URL}/auth/v1/logout`, {
    method:'POST',
    headers:{...HEADERS,'Authorization':`Bearer ${token}`}
  });
}

async function apiResetPassword(email) {
  const r = await fetch(`${SB_URL}/auth/v1/recover`, {
    method:'POST', headers:HEADERS,
    body:JSON.stringify({email})
  });
  return r.json();
}

async function apiGetUser(token) {
  const r = await fetch(`${SB_URL}/auth/v1/user`, {
    headers:{...HEADERS,'Authorization':`Bearer ${token}`}
  });
  return r.json();
}

// Session locale
const SESSION_KEY = 'ap_session';
function getSession() { try{ return JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null'); }catch{return null;} }
function saveSession(s) { s ? sessionStorage.setItem(SESSION_KEY,JSON.stringify(s)) : sessionStorage.removeItem(SESSION_KEY); }

// ═══════════════════════════════════════
// SÉCURITÉ
// ═══════════════════════════════════════
function validateEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.trim()); }
function sanitize(s){ return s.replace(/[<>'"]/g,'').trim(); }
const attempts={};
function rateLimit(k){
  const now=Date.now();
  if(!attempts[k]) attempts[k]=[];
  attempts[k]=attempts[k].filter(t=>now-t<900000);
  if(attempts[k].length>=5) return false;
  attempts[k].push(now);
  return true;
}
function pwdStrength(p){
  const c={len:p.length>=8,upper:/[A-Z]/.test(p),num:/[0-9]/.test(p),spec:/[^A-Za-z0-9]/.test(p)};
  return {score:Object.values(c).filter(Boolean).length,checks:c};
}

// ═══════════════════════════════════════
// APP
// ═══════════════════════════════════════
function App(){
  const [screen,setScreen]=useState('loading'); // loading|auth|verify|home
  const [user,setUser]=useState(null);
  const [session,setSession]=useState(null);
  const [showTerms,setShowTerms]=useState(false);

  useEffect(()=>{
    const s=getSession();
    if(s&&s.access_token){
      setSession(s);
      setUser(s.user||null);
      setScreen(s.user?.email_confirmed_at||s.user?.confirmed_at ? 'home':'verify');
    } else {
      setScreen('auth');
    }
  },[]);

  function onLogin(s){
    saveSession(s);
    setSession(s);
    setUser(s.user);
    const confirmed=s.user?.email_confirmed_at||s.user?.confirmed_at;
    setScreen(confirmed ? 'home':'verify');
  }

  async function onSignOut(){
    if(session?.access_token) await apiSignOut(session.access_token).catch(()=>{});
    saveSession(null);
    setSession(null);
    setUser(null);
    setScreen('auth');
  }

  if(screen==='loading') return <Loading/>;
  if(screen==='verify') return <Verify email={user?.email} onBack={()=>{saveSession(null);setScreen('auth');}}/>;
  if(screen==='home'){
    const role=user?.user_metadata?.role||'aidant';
    if(role==='patient') return <PatientInterface user={user} onSignOut={onSignOut}/>;
    if(role==='soignant') return <SoignantInterface user={user} onSignOut={onSignOut}/>;
    return <AidantInterface user={user} onSignOut={onSignOut}/>;
  }
  return <Auth onLogin={onLogin} showTerms={showTerms} setShowTerms={setShowTerms}/>;
}

function Loading(){
  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)'}}>
      <div style={{textAlign:'center'}}>
        <div style={{width:48,height:48,background:'linear-gradient(135deg,#1D55E8,#137A3A)',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,margin:'0 auto 16px'}}>🤝</div>
        <div style={{fontFamily:"'Syne',sans-serif",fontSize:20,fontWeight:800,marginBottom:12}}>AidantPro</div>
        <div className="spin" style={{borderColor:'var(--bl2)',borderTopColor:'var(--bl)',margin:'0 auto'}}/>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════
// AUTH
// ═══════════════════════════════════════
function Auth({onLogin,showTerms,setShowTerms}){
  const [tab,setTab]=useState('login');
  const [loading,setLoading]=useState(false);
  const [alert,setAlert]=useState(null);
  // Login
  const [lEmail,setLE]=useState('');
  const [lPwd,setLP]=useState('');
  const [showLP,setShowLP]=useState(false);
  // Register
  const [rPrenom,setRP]=useState('');
  const [rNom,setRN]=useState('');
  const [rEmail,setRE]=useState('');
  const [rPwd,setRPwd]=useState('');
  const [rPwd2,setRP2]=useState('');
  const [showRP,setShowRP]=useState(false);
  const [role,setRole]=useState('aidant');
  const [terms,setTerms]=useState(false);
  // Reset
  const [resetEmail,setResetE]=useState('');
  const [resetSent,setResetSent]=useState(false);

  const ps=pwdStrength(rPwd);

  async function doLogin(e){
    e.preventDefault(); setAlert(null);
    if(!validateEmail(lEmail)){setAlert({t:'err',m:'Email invalide'});return;}
    if(!lPwd){setAlert({t:'err',m:'Mot de passe requis'});return;}
    if(!rateLimit(lEmail)){setAlert({t:'err',m:'Trop de tentatives. Attendez 15 minutes.'});return;}
    setLoading(true);
    const data=await apiSignIn(lEmail.trim().toLowerCase(),lPwd).catch(()=>({error:{message:'Erreur réseau'}}));
    setLoading(false);
    if(data.error||!data.access_token){
      const m={'Invalid login credentials':'Email ou mot de passe incorrect','Email not confirmed':'Confirmez votre email avant de vous connecter'};
      setAlert({t:'err',m:m[data.error?.message]||data.error?.message||'Erreur de connexion'});
    } else { onLogin(data); }
  }

  async function doRegister(e){
    e.preventDefault(); setAlert(null);
    if(!rPrenom.trim()){setAlert({t:'err',m:'Prénom requis'});return;}
    if(!validateEmail(rEmail)){setAlert({t:'err',m:'Email invalide'});return;}
    if(ps.score<3){setAlert({t:'err',m:'Mot de passe trop faible'});return;}
    if(rPwd!==rPwd2){setAlert({t:'err',m:'Les mots de passe ne correspondent pas'});return;}
    if(!terms){setAlert({t:'err',m:"Acceptez les conditions d'utilisation"});return;}
    setLoading(true);
    const data=await apiSignUp(rEmail.trim().toLowerCase(),rPwd,sanitize(rPrenom),sanitize(rNom),role).catch(()=>({error:{message:'Erreur réseau'}}));
    setLoading(false);
    if(data.error||!data.id){
      const m={'User already registered':'Un compte existe déjà avec cet email'};
      setAlert({t:'err',m:m[data.error?.message]||data.error?.message||'Erreur lors de la création du compte'});
    } else {
      // Supabase renvoie l'user mais pas forcément de session si email confirmation requise
      if(data.session) { onLogin(data.session); }
      else { setAlert({t:'ok',m:`✓ Compte créé ! Vérifiez votre email ${rEmail} pour confirmer votre inscription.`}); }
    }
  }

  async function doReset(e){
    e.preventDefault();
    if(!validateEmail(resetEmail)){setAlert({t:'err',m:'Email invalide'});return;}
    setLoading(true);
    await apiResetPassword(resetEmail).catch(()=>{});
    setLoading(false);
    setResetSent(true);
  }

  return(
    <div className="wrap">
      {/* GAUCHE */}
      <div className="left">
        <div className="left-logo"><div className="left-logo-ic">🤝</div><span className="left-logo-nm">AidantPro</span></div>
        <div className="left-body">
          <h1 className="left-h">Coordonnez les soins de votre proche en toute sécurité</h1>
          <p className="left-sub">La plateforme qui réunit famille, patient et soignants autour d'un dossier médical partagé.</p>
          <div className="left-stats">
            <div className="stat"><span className="stat-ic">🔒</span><div className="stat-txt"><strong>Données chiffrées AES-256</strong> · Hébergées en Europe · RGPD</div></div>
            <div className="stat"><span className="stat-ic">👨‍👩‍👧</span><div className="stat-txt"><strong>11 millions d'aidants</strong> sans outil adapté en France</div></div>
            <div className="stat"><span className="stat-ic">💰</span><div className="stat-txt"><strong>12 000€/an</strong> d'aides non réclamées par famille aidante</div></div>
          </div>
        </div>
        <p className="left-ft">© 2026 AidantPro · Données hébergées en Europe 🇪🇺</p>
      </div>

      {/* DROITE */}
      <div className="right">
        <div className="right-in">
          <div className="mob-logo"><div className="mob-ic">🤝</div><span className="mob-nm">AidantPro</span></div>

          {tab!=='reset'&&<>
            <h1>{tab==='login'?'Connexion':'Créer un compte'}</h1>
            <p className="sub">{tab==='login'?'Accédez à votre espace sécurisé':'Rejoignez AidantPro — 14 jours gratuits'}</p>
            <div className="tabs">
              <button className={`tab ${tab==='login'?'on':''}`} onClick={()=>{setTab('login');setAlert(null);}}>Connexion</button>
              <button className={`tab ${tab==='register'?'on':''}`} onClick={()=>{setTab('register');setAlert(null);}}>Inscription</button>
            </div>
          </>}

          {alert&&<div className={`alert ${alert.t}`}><span>{alert.t==='err'?'⊘':'✓'}</span><div>{alert.m}</div></div>}

          {/* LOGIN */}
          {tab==='login'&&<form onSubmit={doLogin}>
            <div className="fg">
              <label className="fl">Adresse email</label>
              <div className="fi-w">
                <input className={`fi ${lEmail&&!validateEmail(lEmail)?'err':lEmail&&validateEmail(lEmail)?'ok':''}`} type="email" placeholder="marie@email.fr" value={lEmail} onChange={e=>setLE(e.target.value)} autoComplete="email" required/>
                {lEmail&&<span className="fi-ic">{validateEmail(lEmail)?'✓':'⊘'}</span>}
              </div>
            </div>
            <div className="fg">
              <label className="fl">Mot de passe <button type="button" className="flink" onClick={()=>{setTab('reset');setAlert(null);}}>Oublié ?</button></label>
              <div className="fi-w">
                <input className="fi" type={showLP?'text':'password'} placeholder="••••••••" value={lPwd} onChange={e=>setLP(e.target.value)} autoComplete="current-password" style={{paddingRight:42}} required/>
                <button type="button" className="eye" onClick={()=>setShowLP(!showLP)}>{showLP?'🙈':'👁️'}</button>
              </div>
            </div>
            <button className="btn" type="submit" disabled={loading}>{loading?<><span className="spin"/>Connexion…</>:'Se connecter →'}</button>
          </form>}

          {/* REGISTER */}
          {tab==='register'&&<form onSubmit={doRegister}>
            <div className="g2">
              <div><label className="fl">Prénom *</label><input className="fi" placeholder="Marie" value={rPrenom} onChange={e=>setRP(e.target.value)} required/></div>
              <div><label className="fl">Nom</label><input className="fi" placeholder="Dupont" value={rNom} onChange={e=>setRN(e.target.value)}/></div>
            </div>
            <div className="fg">
              <label className="fl">Email *</label>
              <div className="fi-w">
                <input className={`fi ${rEmail&&!validateEmail(rEmail)?'err':rEmail&&validateEmail(rEmail)?'ok':''}`} type="email" placeholder="marie@email.fr" value={rEmail} onChange={e=>setRE(e.target.value)} required/>
                {rEmail&&<span className="fi-ic">{validateEmail(rEmail)?'✓':'⊘'}</span>}
              </div>
            </div>
            <div className="fg">
              <label className="fl">Votre rôle *</label>
              <div className="roles">
                {[['aidant','👩‍👧','Aidant','Famille'],['patient','👴','Patient','Proche aidé'],['soignant','👨‍⚕️','Soignant','Pro santé']].map(([v,ic,nm,ds])=>(
                  <div key={v} className={`role ${role===v?'sel':''}`} onClick={()=>setRole(v)}>
                    <div className="role-ic">{ic}</div>
                    <div className="role-nm">{nm}</div>
                    <div className="role-ds">{ds}</div>
                  </div>
                ))}
              </div>
            </div>
            <div className="fg">
              <label className="fl">Mot de passe *</label>
              <div className="fi-w">
                <input className="fi" type={showRP?'text':'password'} placeholder="Minimum 8 caractères" value={rPwd} onChange={e=>setRPwd(e.target.value)} style={{paddingRight:42}} required/>
                <button type="button" className="eye" onClick={()=>setShowRP(!showRP)}>{showRP?'🙈':'👁️'}</button>
              </div>
              {rPwd&&<>
                <div className="pwd-bars">{[1,2,3,4].map(i=><div key={i} className={`pwd-bar ${i<=ps.score?`s${ps.score}`:''}`}/>)}</div>
                <div className="pwd-reqs">
                  {[['len','8 caractères min'],['upper','1 majuscule'],['num','1 chiffre'],['spec','1 caractère spécial']].map(([k,l])=>(
                    <div key={k} className={`req ${ps.checks[k]?'ok':''}`}><div className="req-dot"/>{l}</div>
                  ))}
                </div>
              </>}
            </div>
            <div className="fg">
              <label className="fl">Confirmer le mot de passe *</label>
              <div className="fi-w">
                <input className={`fi ${rPwd2&&rPwd!==rPwd2?'err':rPwd2&&rPwd===rPwd2?'ok':''}`} type="password" placeholder="Répétez le mot de passe" value={rPwd2} onChange={e=>setRP2(e.target.value)} style={{paddingRight:42}} required/>
                {rPwd2&&<span className="fi-ic">{rPwd===rPwd2?'✓':'⊘'}</span>}
              </div>
              {rPwd2&&rPwd!==rPwd2&&<div className="errmsg">⊘ Les mots de passe ne correspondent pas</div>}
            </div>
            <div className="cb-row" onClick={()=>setTerms(!terms)}>

        <div className="pc" onClick={()=>setPage("dossier")}><div className="pc-n">{proche.prenom} {proche.nom}</div><div className="pc-s">{proche.age} ans · Alzheimer modéré</div></div>
        <nav style={{padding:"6px 8px",flex:1,overflowY:"auto"}}>
          {NAV.map(n=><button key={n.id} className={`ni${page===n.id?" on":""}`} onClick={()=>setPage(n.id)}><span className="ni-ic">{n.icon}</span><span className="ni-lb">{n.label}</span></button>)}
        </nav>
        <button className="sb-sw" onClick={()=>setRole(null)}>⇄ Changer d'interface</button>
        <div className="sb-ft">AidantPro · Plan Famille <strong style={{color:"var(--gn)"}}>15€/mois</strong></div>
      </aside>
      <main className="main">
        {page==="dashboard"&&<Dashboard {...P}/>}
        {page==="dossier"&&<Dossier {...P}/>}
        {page==="agenda"&&<Agenda rdvs={rdvs} setRdvs={setRdvs}/>}
        {page==="medicaments"&&<Medicaments meds={meds} setMeds={setMeds} today={today} tp={tp} pris={pris} tot={tot}/>}
        {page==="journal"&&<Journal journal={journal} setJournal={setJournal} today={today} aiText={aiText} aiLoad={aiLoad} genAI={genAI}/>}
        {page==="aides"&&<Aides/>}
        {page==="bienetre"&&<Bienetre zarit={zarit} setZarit={setZarit} zPct={zPct} zColor={zColor}/>}

function Dashboard({proche,alerts,rdvs,journal,meds,pris,tot,setPage,today,tp,aiText,aiLoad,genAI}){
  const pr=rdvs.filter(r=>!r.fait).sort((a,b)=>a.date.localeCompare(b.date))[0];
  return(
    <>
      <div className="ph"><div><div className="pt">Bonjour, Marie 👋</div><div className="ps">{new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</div></div><button className="btn bg2" onClick={genAI} disabled={aiLoad}>{aiLoad?<><span className="spin"/>Génération…</>:"Résumé IA médecin"}</button></div>
      {alerts.map((a,i)=><div key={i} className={`al al-${a.t==="w"?"w":"d"}`}><span>{a.t==="w"?"⚠":"⊘"}</span>{a.m}</div>)}
      {aiText&&<div className="ai-box"><div className="ai-lbl">Résumé IA — à présenter au médecin</div><div className="ai-txt">{aiText}</div></div>}
      <div className="g4">
        <div className="kpi"><div className="kv">{pris}<span style={{fontSize:16,fontWeight:400,color:"var(--mu)"}}>/{tot}</span></div><div className="kl">Prises confirmées</div></div>
        <div className="kpi"><div className="kv">{rdvs.filter(r=>!r.fait).length}</div><div className="kl">RDV à venir</div></div>
        <div className="kpi"><div className="kv">{journal.length}</div><div className="kl">Notes journal</div></div>
        <div className="kpi" style={{background:"var(--bl2)",cursor:"pointer"}} onClick={()=>setPage("aides")}><div className="kv" style={{color:"var(--bl)"}}>4</div><div className="kl" style={{color:"var(--bl)"}}>Aides disponibles →</div></div>
      </div>
      <div className="g2">
        <div className="card" style={{cursor:"pointer"}} onClick={()=>setPage("agenda")}>
          <div className="ct">Prochain rendez-vous</div>
          {pr?<div style={{display:"flex",gap:12}}><div className="rd-dt" style={{background:"var(--bl2)"}}><div className="rd-day" style={{color:"var(--bl)"}}>{pr.date.split("-")[2]}</div><div className="rd-mo" style={{color:"var(--bl)"}}>{new Date(pr.date+"T12:00").toLocaleString("fr-FR",{month:"short"})}</div><div className="rd-hr">{pr.heure}</div></div><div><div style={{fontSize:14,fontWeight:600,marginBottom:3}}>{pr.titre}</div><div style={{fontSize:12,color:"var(--mu)"}}>{pr.lieu}</div><div style={{marginTop:7}}><span className={`badge ${pr.assigne?"b-bl":"b-rd"}`}>{pr.assigne||"Non assigné"}</span></div></div></div>:<div className="empty">Aucun RDV</div>}
        </div>
        <div className="card" style={{cursor:"pointer"}} onClick={()=>setPage("journal")}>
          <div className="ct">Dernière note</div>
          {journal[0]?<><div style={{fontSize:13,lineHeight:1.75,marginBottom:9}}>{journal[0].contenu.slice(0,100)}…</div><span className={`badge ${journal[0].humeur==="bien"?"b-gn":journal[0].humeur==="moyen"?"b-am":"b-rd"}`}>{journal[0].humeur==="bien"?"Bien":journal[0].humeur==="moyen"?"Moyen":"Difficile"}</span></>:<div className="empty">Aucune note</div>}
        </div>
      </div>
      <div className="card">
        <div className="fxb"><div className="ct" style={{marginBottom:0}}>Médicaments du jour</div><span style={{fontSize:11,color:"var(--mu)"}}>{pris}/{tot}</span></div>
        <div className="sbar" style={{margin:"10px 0 14px"}}><div className="sfill" style={{width:`${tot?(pris/tot)*100:0}%`,background:pris===tot?"var(--gn)":"var(--bl)"}}/></div>
        {meds.map(m=><div key={m.id} className="mr"><div><div className="mn">{m.nom} <span style={{fontWeight:400,color:"var(--mu)",fontSize:13}}>{m.dose}</span></div>{m.renouvellement<=10&&<div style={{fontSize:11,color:"var(--am)"}}>⚠ J-{m.renouvellement}</div>}</div><div className="hg">{m.horaires.map(h=>{const ok=!!m.prises[`${today}_${h}`];return<button key={h} className={`hb${ok?" ok":""}`} onClick={()=>tp(m.id,h)}>{h} {ok?"✓":"○"}</button>;})}</div></div>)}
      </div>
    </>
  );
}

function Dossier({proche,setProche,aiText,aiLoad,genAI}){
  const [edit,setEdit]=useState(false);
  const [ed,setEd]=useState({...proche});
  const [np,setNp]=useState(""); const [na,setNa]=useState("");
  function save(){setProche({...ed});setEdit(false);}
  function addTag(f,v,sv){if(!v.trim())return;setProche(p=>({...p,[f]:[...p[f],v.trim()]}));sv("");}
  function rmTag(f,i){setProche(p=>({...p,[f]:p[f].filter((_,idx)=>idx!==i)}));}
  return(
    <>
      <div className="ph"><div><div className="pt">Dossier médical</div><div className="ps">{proche.prenom} {proche.nom} · {proche.age} ans</div></div><div className="fxs"><button className="btn bg2" onClick={genAI} disabled={aiLoad}>{aiLoad?<><span className="spin"/>…</>:"Résumé IA"}</button><button className="btn bs" onClick={()=>{setEdit(!edit);setEd({...proche});}}>{edit?"Annuler":"Modifier"}</button></div></div>
      {aiText&&<div className="ai-box"><div className="ai-lbl">Résumé IA pour le médecin</div><div className="ai-txt">{aiText}</div></div>}
      <div className="g2">
        <div className="gap-b">
          <div className="card">
            <div className="ct">Informations générales</div>
            {edit?(
              <><div className="g2"><div className="fg"><label className="fl">Prénom</label><input className="fi" value={ed.prenom} onChange={e=>setEd({...ed,prenom:e.target.value})}/></div><div className="fg"><label className="fl">Nom</label><input className="fi" value={ed.nom} onChange={e=>setEd({...ed,nom:e.target.value})}/></div><div className="fg"><label className="fl">Groupe sanguin</label><input className="fi" value={ed.groupeSanguin} onChange={e=>setEd({...ed,groupeSanguin:e.target.value})}/></div><div className="fg"><label className="fl">Mutuelle</label><input className="fi" value={ed.mutuelle} onChange={e=>setEd({...ed,mutuelle:e.target.value})}/></div></div><div className="fxs"><button className="btn bp" onClick={save}>Enregistrer</button><button className="btn bs" onClick={()=>setEdit(false)}>Annuler</button></div></>
            ):(
              <><div className="ir"><span className="ik">Nom</span><span className="iv">{proche.prenom} {proche.nom}</span></div><div className="ir"><span className="ik">Âge</span><span className="iv">{proche.age} ans</span></div><div className="ir"><span className="ik">Groupe sanguin</span><span className="iv"><span className="badge b-rd">{proche.groupeSanguin}</span></span></div><div className="ir"><span className="ik">Mutuelle</span><span className="iv" style={{fontSize:12}}>{proche.mutuelle}</span></div></>
            )}
          </div>
          <div className="card">
            <div className="ct">Pathologies</div>
            <div style={{marginBottom:10}}>{proche.pathologies.map((p,i)=><span key={i} className="tag-i" style={{background:"var(--am2)",color:"var(--am)"}}>{p}<button className="tag-rm" onClick={()=>rmTag("pathologies",i)}>×</button></span>)}</div>
            <div className="fxs"><input className="fi" style={{flex:1,fontSize:12}} placeholder="Ajouter…" value={np} onChange={e=>setNp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTag("pathologies",np,setNp)}/><button className="btn bp" style={{padding:"7px 12px"}} onClick={()=>addTag("pathologies",np,setNp)}>+</button></div>
          </div>
          <div className="card">
            <div className="ct">Allergies</div>
            <div style={{marginBottom:10}}>{proche.allergies.map((a,i)=><span key={i} className="tag-i" style={{background:"var(--rd2)",color:"var(--rd)"}}>{a}<button className="tag-rm" onClick={()=>rmTag("allergies",i)}>×</button></span>)}</div>
            <div className="fxs"><input className="fi" style={{flex:1,fontSize:12}} placeholder="Ajouter…" value={na} onChange={e=>setNa(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTag("allergies",na,setNa)}/><button className="btn br2" style={{padding:"7px 12px"}} onClick={()=>addTag("allergies",na,setNa)}>+</button></div>
          </div>
        </div>
        <div className="gap-b">
          <div className="card">
            <div className="ct">Équipe médicale</div>
            {proche.medecins.map(m=><div key={m.id} style={{padding:"11px 0",borderBottom:"1px solid var(--bd)"}}><div style={{fontSize:14,fontWeight:600,marginBottom:2}}>{m.nom}</div><span className="badge b-bl">{m.specialite}</span><div style={{fontSize:12,color:"var(--mu)",marginTop:6}}>📞 {m.tel}</div></div>)}
          </div>
          <div className="card">
            <div className="ct">Contacts urgence</div>
            {proche.contacts.map(c=><div key={c.id} className="ir"><div><div style={{fontSize:13,fontWeight:600}}>{c.nom} ({c.lien})</div><div style={{fontSize:12,color:"var(--mu)"}}>{c.tel}</div></div></div>)}
            <div className="ir"><span className="ik">Urgences</span><span className="iv" style={{color:"var(--rd)",fontWeight:700}}>SAMU 15</span></div>
          </div>
        </div>
      </div>
    </>
  );
}

function Agenda({rdvs,setRdvs}){
  const [showAdd,setShowAdd]=useState(false);
  const [nr,setNr]=useState({titre:"",date:"",heure:"",lieu:"",assigne:"",notes:""});
  function add(){if(!nr.titre||!nr.date)return;setRdvs(p=>[...p,{...nr,id:Date.now(),fait:false}].sort((a,b)=>a.date.localeCompare(b.date)));setNr({titre:"",date:"",heure:"",lieu:"",assigne:"",notes:""});setShowAdd(false);}
  const av=rdvs.filter(r=>!r.fait);
  return(
    <>
      <div className="ph"><div><div className="pt">Agenda médical</div><div className="ps">{av.length} rendez-vous à venir</div></div><button className="btn bp" onClick={()=>setShowAdd(!showAdd)}>+ Nouveau RDV</button></div>
      {showAdd&&<div className="card"><div className="ct">Nouveau rendez-vous</div><div className="g2"><div className="fg"><label className="fl">Titre</label><input className="fi" value={nr.titre} onChange={e=>setNr({...nr,titre:e.target.value})}/></div><div className="fg"><label className="fl">Date</label><input className="fi" type="date" value={nr.date} onChange={e=>setNr({...nr,date:e.target.value})}/></div><div className="fg"><label className="fl">Heure</label><input className="fi" value={nr.heure} onChange={e=>setNr({...nr,heure:e.target.value})} placeholder="14h30"/></div><div className="fg"><label className="fl">Lieu</label><input className="fi" value={nr.lieu} onChange={e=>setNr({...nr,lieu:e.target.value})}/></div><div className="fg"><label className="fl">Assigné à</label><input className="fi" value={nr.assigne} onChange={e=>setNr({...nr,assigne:e.target.value})}/></div><div className="fg"><label className="fl">Notes</label><input className="fi" value={nr.notes} onChange={e=>setNr({...nr,notes:e.target.value})}/></div></div><div className="fxs"><button className="btn bp" onClick={add}>Enregistrer</button><button className="btn bs" onClick={()=>setShowAdd(false)}>Annuler</button></div></div>}
      {av.map(r=>{const d=new Date(r.date+"T12:00");return<div key={r.id} className="rc"><div className="rd-dt" style={{background:"var(--bl2)"}}><div className="rd-day" style={{color:"var(--bl)"}}>{r.date.split("-")[2]}</div><div className="rd-mo" style={{color:"var(--bl)"}}>{d.toLocaleString("fr-FR",{month:"short"})}</div><div className="rd-hr">{r.heure}</div></div><div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,marginBottom:3}}>{r.titre}</div><div style={{fontSize:12,color:"var(--mu)"}}>{r.lieu}</div>{r.notes&&<div style={{fontSize:12,color:"var(--mu)",fontStyle:"italic",marginTop:3}}>{r.notes}</div>}<div className="fxs mt8"><span className={`badge ${r.assigne?"b-bl":"b-rd"}`}>{r.assigne||"Non assigné"}</span><button className="btn bs" style={{padding:"3px 9px",fontSize:11}} onClick={()=>setRdvs(p=>p.map(x=>x.id===r.id?{...x,fait:true}:x))}>Effectué</button><button className="btn br2" style={{padding:"3px 9px",fontSize:11}} onClick={()=>setRdvs(p=>p.filter(x=>x.id!==r.id))}>×</button></div></div></div>;})}
    </>
  );
}

function Medicaments({meds,setMeds,today,tp,pris,tot}){
  const [showAdd,setShowAdd]=useState(false);
  const [nm,setNm]=useState({nom:"",dose:"",horaires:"08h00",renouvellement:30,indication:""});
  function add(){if(!nm.nom)return;setMeds(p=>[...p,{...nm,id:Date.now(),horaires:nm.horaires.split(",").map(h=>h.trim()),prises:{}}]);setNm({nom:"",dose:"",horaires:"08h00",renouvellement:30,indication:""});setShowAdd(false);}
  return(
    <>
      <div className="ph"><div><div className="pt">Médicaments</div><div className="ps">{pris}/{tot} prises aujourd'hui · {meds.length} médicaments</div></div><button className="btn bp" onClick={()=>setShowAdd(!showAdd)}>+ Ajouter</button></div>
      <div className="sbar" style={{marginBottom:16}}><div className="sfill" style={{width:`${tot?(pris/tot)*100:0}%`,background:pris===tot?"var(--gn)":"var(--bl)"}}/></div>
      {showAdd&&<div className="card"><div className="g2"><div className="fg"><label className="fl">Nom</label><input className="fi" value={nm.nom} onChange={e=>setNm({...nm,nom:e.target.value})}/></div><div className="fg"><label className="fl">Dosage</label><input className="fi" value={nm.dose} onChange={e=>setNm({...nm,dose:e.target.value})} placeholder="500mg"/></div><div className="fg"><label className="fl">Horaires (virgules)</label><input className="fi" value={nm.horaires} onChange={e=>setNm({...nm,horaires:e.target.value})}/></div><div className="fg"><label className="fl">Indication</label><input className="fi" value={nm.indication} onChange={e=>setNm({...nm,indication:e.target.value})}/></div></div><div className="fxs"><button className="btn bp" onClick={add}>Enregistrer</button><button className="btn bs" onClick={()=>setShowAdd(false)}>Annuler</button></div></div>}
      <div className="card">{meds.map(m=><div key={m.id} className="mr"><div style={{flex:1}}><div className="fxs" style={{flexWrap:"wrap",marginBottom:3}}><div className="mn">{m.nom}</div><span className="badge b-bl">{m.dose}</span>{m.renouvellement<=10&&<span className="badge b-am">J-{m.renouvellement}</span>}</div><div className="md">{m.indication}</div></div><div className="fxs" style={{flexDirection:"column",alignItems:"flex-end",gap:6}}><div className="hg">{m.horaires.map(h=>{const ok=!!m.prises[`${today}_${h}`];return<button key={h} className={`hb${ok?" ok":""}`} onClick={()=>tp(m.id,h)}>{h} {ok?"✓":"○"}</button>;})}</div><button className="btn br2" style={{padding:"3px 8px",fontSize:11}} onClick={()=>setMeds(p=>p.filter(x=>x.id!==m.id))}>Supprimer</button></div></div>)}</div>
    </>
  );
}

function Journal({journal,setJournal,today,aiText,aiLoad,genAI}){
  const [nn,setNn]=useState({contenu:"",humeur:"bien",tension:"",auteur:"Marie"});
  function add(){if(!nn.contenu.trim())return;setJournal(p=>[{...nn,id:Date.now(),date:today},...p]);setNn({contenu:"",humeur:"bien",tension:"",auteur:"Marie"});}
  return(
    <>
      <div className="ph"><div><div className="pt">Journal de bord</div><div className="ps">{journal.length} observations</div></div><button className="btn bg2" onClick={genAI} disabled={aiLoad}>{aiLoad?<><span className="spin"/>…</>:"Résumé IA médecin"}</button></div>
      {aiText&&<div className="ai-box"><div className="ai-lbl">Résumé IA pour le médecin</div><div className="ai-txt">{aiText}</div></div>}
      <div className="card" style={{marginBottom:16}}>
        <div className="ct">Nouvelle note — {today}</div>
        <div className="fg"><textarea className="fi fta" placeholder="Comportement, humeur, médicaments, incidents…" value={nn.contenu} onChange={e=>setNn({...nn,contenu:e.target.value})}/></div>
        <div className="g2" style={{marginBottom:10}}><div className="fg"><label className="fl">Tension</label><input className="fi" value={nn.tension} onChange={e=>setNn({...nn,tension:e.target.value})} placeholder="13/8"/></div><div className="fg"><label className="fl">Auteur</label><select className="fi" value={nn.auteur} onChange={e=>setNn({...nn,auteur:e.target.value})}>{["Marie","Émile","Aide à domicile","Autre"].map(v=><option key={v}>{v}</option>)}</select></div></div>
        <div className="fxb"><div className="fxs">{[["bien","😊 Bien"],["moyen","😐 Moyen"],["difficile","😔 Difficile"]].map(([v,l])=><button key={v} className={`btn${nn.humeur===v?" bp":" bs"}`} style={{padding:"5px 12px",fontSize:12}} onClick={()=>setNn({...nn,humeur:v})}>{l}</button>)}</div><button className="btn bp" onClick={add}>Enregistrer</button></div>
      </div>
      {journal.map(e=><div key={e.id} className={`je ${e.humeur}`}><div className="jm"><span className="jd">{e.date}</span><span className="ja">{e.auteur}</span><span className={`badge ${e.humeur==="bien"?"b-gn":e.humeur==="moyen"?"b-am":"b-rd"}`}>{e.humeur==="bien"?"Bien":e.humeur==="moyen"?"Moyen":"Difficile"}</span></div><div className="jc">{e.contenu}</div>{e.tension&&<span style={{fontSize:11,background:"var(--bg)",border:"1px solid var(--bd)",borderRadius:6,padding:"3px 8px",color:"var(--mu)"}}>❤️ {e.tension}</span>}<button className="btn br2 mt8" style={{padding:"2px 8px",fontSize:11}} onClick={()=>setJournal(p=>p.filter(j=>j.id!==e.id))}>Supprimer</button></div>)}
    </>
  );
}

function Aides(){
  return(
    <>
      <div className="ph"><div><div className="pt">Aides financières</div><div className="ps">{AIDES.filter(a=>a.statut==="eligible").length} aides éligibles identifiées</div></div></div>
      <div className="al al-s">💰 Estimation totale : <strong>≈ 14 000€/an</strong> d'aides potentielles non réclamées</div>
      <div style={{height:14}}/>
      <div className="g2">{AIDES.map((a,i)=><div key={i} className="ac" style={{borderColor:a.statut==="eligible"?"var(--gn3)":"var(--rd3)",opacity:a.statut==="non-eligible"?0.6:1}}><span className={`badge ${a.statut==="eligible"?"b-gn":"b-rd"}`} style={{marginBottom:8,display:"inline-block"}}>{a.statut==="eligible"?"✓ Éligible":"✗ Non éligible"}</span><div className="an">{a.nom}</div><div className="am-v" style={{color:a.statut==="eligible"?"var(--gn)":"var(--mu)"}}>{a.montant}</div><div className="ar">◎ {a.condition}</div><div className="ar">◈ Dossier : {a.dossier}</div>{a.statut==="eligible"&&<button className="btn bp mt8" style={{width:"100%",justifyContent:"center",fontSize:12}}>Voir le formulaire →</button>}</div>)}</div>
    </>
  );
}

function Bienetre({zarit,setZarit,zPct,zColor}){
  const nb=Object.keys(zarit).length;
  const label=zPct<30?"Faible charge":zPct<60?"Charge modérée":"Charge élevée";
  const opts=["Jamais","Rarement","Parfois","Souvent","Toujours"];
  return(
    <>
      <div className="ph"><div><div className="pt">Mon bien-être</div><div className="ps">Échelle de Zarit · {nb}/{ZARIT.length} questions</div></div>{nb>0&&<button className="btn bs" onClick={()=>setZarit({})}>Réinitialiser</button>}</div>
      {nb===ZARIT.length&&<div className="card"><div className="ct">Score de charge aidant</div><div style={{display:"flex",alignItems:"center",gap:16}}><div style={{flex:1}}><div className="sbar"><div className="sfill" style={{width:`${zPct}%`,background:zColor}}/></div><div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"var(--mu)",marginTop:4}}><span>Faible</span><span>Élevée</span></div></div><div style={{textAlign:"center",minWidth:100}}><div style={{fontFamily:"Syne,sans-serif",fontSize:32,fontWeight:800,color:zColor}}>{zPct}%</div><div style={{fontSize:13,fontWeight:600,color:zColor}}>{label}</div></div></div>{zPct>=60&&<div className="al al-d mt8">⚠ <strong>0 800 360 360</strong> — numéro national aidants (gratuit, 7j/7)</div>}</div>}
      {ZARIT.map((q,i)=><div key={i} className="zq"><div className="zt"><strong style={{color:"var(--mu)",fontSize:12}}>{i+1}.</strong> {q}</div><div className="zo">{opts.map((opt,val)=><button key={val} className={`zob${zarit[i]===val?` s${val}`:""}`} onClick={()=>setZarit(p=>({...p,[i]:val}))}>{opt}</button>)}</div></div>)}
      <div className="card mt14"><div className="ct">Ressources de soutien</div>{[{n:"Numéro national aidants",v:"0 800 360 360",s:"Gratuit · 7j/7"},{n:"France Alzheimer",v:"0 811 112 112",s:"Accompagnement familles"}].map((r,i)=><div key={i} className="ir"><div><div style={{fontSize:13,fontWeight:600}}>{r.n}</div><div style={{fontSize:11,color:"var(--mu)"}}>{r.s}</div></div><span className="badge b-bl">{r.v}</span></div>)}</div>
    </>
  );
}

function Params({setRole}){
  const [notifs,setNotifs]=useState({meds:true,rdv:true,renouv:true,urgent:true});
  return(
    <>
      <div className="ph"><div><div className="pt">Paramètres</div><div className="ps">Profil, notifications, abonnement</div></div></div>
      <div className="g2">
        <div className="gap-b">
          <div className="card"><div className="ct">Mon profil</div><div className="fg"><label className="fl">Nom</label><input className="fi" defaultValue="Marie Dubois"/></div><div className="fg"><label className="fl">Email</label><input className="fi" defaultValue="marie.dubois@email.fr"/></div><button className="btn bp mt8">Enregistrer</button></div>
          <div className="card"><div className="ct">Abonnement</div><div className="ir"><span className="ik">Plan</span><span className="iv"><span className="badge b-gn">Famille · 15€/mois</span></span></div><div className="ir"><span className="ik">Données hébergées</span><span className="iv"><span className="badge b-bl">🇫🇷 France</span></span></div></div>
          <div className="card"><div className="ct">Changer d'interface</div><div style={{display:"flex",flexDirection:"column",gap:8,marginTop:4}}><button className="btn bs" onClick={()=>setRole("patient")} style={{justifyContent:"flex-start"}}>👴 Interface Patient</button><button className="btn bs" onClick={()=>setRole("soignant")} style={{justifyContent:"flex-start"}}>👨‍⚕️ Interface Soignant</button><button className="btn bs" onClick={()=>setRole(null)} style={{justifyContent:"flex-start"}}>⇄ Retour à l'accueil</button></div></div>
        </div>
        <div className="card"><div className="ct">Notifications</div>{[["meds","Rappels médicaments","Prises non confirmées"],["rdv","Rappels rendez-vous","48h et 2h avant"],["renouv","Renouvellements","15 jours avant la fin"],["urgent","Alertes urgentes","Notifications critiques"]].map(([k,l,s])=><div key={k} className="ir"><div><div style={{fontSize:13,fontWeight:500}}>{l}</div><div style={{fontSize:11,color:"var(--mu)"}}>{s}</div></div><div style={{position:"relative",width:40,height:22,borderRadius:11,background:notifs[k]?"var(--bl)":"var(--bd)",cursor:"pointer",transition:"background .2s",flexShrink:0}} onClick={()=>setNotifs(p=>({...p,[k]:!p[k]}))}><div style={{position:"absolute",top:2,left:notifs[k]?20:2,width:18,height:18,borderRadius:"50%",background:"#fff",transition:"left .2s",boxShadow:"0 1px 3px rgba(0,0,0,.2)"}}/></div></div>)}</div>
      </div>
    </>
  );
}

function SoignantInterface({setRole}){
  const [email,setEmail]=useState("");
  const [sent,setSent]=useState(false);
  return(
    <div className="sgnt">
      <div className="sgnt-ic">👨‍⚕️</div>
      <h2 className="sgnt-h">Interface Soignant — Bêta</h2>
      <p className="sgnt-sub">L'espace dédié aux médecins et professionnels de santé est en cours de finalisation. Inscrivez-vous pour accéder en avant-première.</p>
      <div className="sgnt-feats">
        <div className="sgnt-feat"><div className="sgnt-feat-ic">📋</div><div className="sgnt-feat-t">Dossier partagé</div><div className="sgnt-feat-d">Accès au dossier médical complet</div></div>
        <div className="sgnt-feat"><div className="sgnt-feat-ic">📤</div><div className="sgnt-feat-t">Dépôt documents</div><div className="sgnt-feat-d">Comptes-rendus et ordonnances</div></div>
        <div className="sgnt-feat"><div className="sgnt-feat-ic">📖</div><div className="sgnt-feat-t">Journal de bord</div><div className="sgnt-feat-d">Observations de la famille</div></div>
        <div className="sgnt-feat"><div className="sgnt-feat-ic">💬</div><div className="sgnt-feat-t">Messagerie</div><div className="sgnt-feat-d">Communication sécurisée famille</div></div>
      </div>
      {sent?<div style={{fontSize:18,fontWeight:700,color:"var(--gn)",marginBottom:24}}>✓ Vous serez notifié dès l'ouverture !</div>:<div className="sgnt-form"><input className="sgnt-input" type="email" placeholder="Votre email professionnel" value={email} onChange={e=>setEmail(e.target.value)}/><button className="sgnt-btn" onClick={()=>{if(email.trim())setSent(true);}}>Notifier</button></div>}
      <button className="btn bs" style={{marginTop:24}} onClick={()=>setRole(null)}>← Retour à l'accueil</button>
    </div>
  );
}

// WRAPPERS - connect auth user to app interfaces
function PatientInterface({user, onSignOut}) {
  const [lang, setLang] = React.useState('fr');
  return <Patient lang={lang} setLang={setLang} setRole={onSignOut} user={user}/>;
}
function AidantInterface({user, onSignOut}) {
  return <Aidant setRole={onSignOut} user={user}/>;
}
function SoignantInterface({user, onSignOut}) {
  return <Soignant setRole={onSignOut} user={user}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
