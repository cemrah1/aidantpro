<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AidantPro</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bl:#1D55E8;--bl2:#EBF0FD;--bl3:#BFCFFA;--gn:#137A3A;--gn2:#EAF5EE;--gn3:#C8E8D3;--am:#B85C00;--am2:#FEF3E6;--am3:#FDDDB8;--rd:#C0272B;--rd2:#FDEAEA;--rd3:#F8C5C5;--pu:#5B21B6;--pu2:#EDE9FE;--txt:#1A1815;--mu:#6B6860;--bg:#F7F5F1;--sur:#FFF;--bd:#E2DDD5;--sw:230px}
body{font-family:'Instrument Sans',sans-serif;color:var(--txt);background:var(--bg);min-height:100vh}
input,button,select,textarea{font-family:inherit}
/* LOADING */
.loader{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.loader-inner{text-align:center}
.loader-ic{width:52px;height:52px;background:linear-gradient(135deg,var(--bl),var(--gn));border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}
.loader-nm{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;margin-bottom:12px}
.spinner{width:22px;height:22px;border:3px solid var(--bl2);border-top-color:var(--bl);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
/* AUTH LAYOUT */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
@media(max-width:768px){.auth{grid-template-columns:1fr}}
.auth-l{background:linear-gradient(160deg,#0D1B4B 0%,var(--bl) 45%,var(--gn) 100%);padding:44px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-l::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='2' fill='%23fff' fill-opacity='.03'/%3E%3C/svg%3E")}
@media(max-width:768px){.auth-l{display:none}}
.al-logo{display:flex;align-items:center;gap:12px;position:relative}
.al-logo-ic{width:42px;height:42px;background:rgba(255,255,255,.15);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid rgba(255,255,255,.2)}
.al-logo-nm{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#fff}
.al-body{position:relative}
.al-h{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;color:#fff;line-height:1.15;margin-bottom:14px;letter-spacing:-1px}
.al-sub{font-size:14px;color:rgba(255,255,255,.7);line-height:1.7;margin-bottom:26px}
.al-stats{display:flex;flex-direction:column;gap:10px}
.al-stat{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.1);border-radius:10px;padding:11px 14px;border:1px solid rgba(255,255,255,.15)}
.al-stat-ic{font-size:18px;flex-shrink:0}
.al-stat-txt{font-size:12px;color:rgba(255,255,255,.85);line-height:1.4}
.al-stat-txt strong{color:#fff}
.al-ft{position:relative;font-size:11px;color:rgba(255,255,255,.4)}
.auth-r{padding:40px;display:flex;flex-direction:column;justify-content:center;background:var(--sur);overflow-y:auto}
.auth-r-in{max-width:400px;width:100%;margin:0 auto}
.mob-logo{display:none;align-items:center;gap:10px;margin-bottom:26px}
@media(max-width:768px){.mob-logo{display:flex}}
.mob-ic{width:34px;height:34px;background:linear-gradient(135deg,var(--bl),var(--gn));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.mob-nm{font-family:'Syne',sans-serif;font-size:18px;font-weight:800}
.auth-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;margin-bottom:5px;letter-spacing:-.5px}
.auth-sub{font-size:13px;color:var(--mu);margin-bottom:20px;line-height:1.6}
.tabs{display:flex;background:var(--bg);border-radius:9px;padding:3px;margin-bottom:20px}
.tab{flex:1;padding:7px;border-radius:7px;border:none;background:transparent;font-size:12px;font-weight:600;cursor:pointer;color:var(--mu);transition:all .15s}
.tab.active{background:var(--sur);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.form-group{margin-bottom:12px}
.form-label{font-size:10px;font-weight:600;color:var(--mu);margin-bottom:4px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.5px}
.form-label button{font-size:10px;font-weight:500;color:var(--bl);text-transform:none;letter-spacing:0;border:none;background:none;cursor:pointer;padding:0}
.input-wrap{position:relative}
.form-input{width:100%;padding:10px 13px;border:1.5px solid var(--bd);border-radius:9px;font-size:13px;background:var(--bg);color:var(--txt);outline:none;transition:all .15s}
.form-input:focus{border-color:var(--bl);background:var(--sur);box-shadow:0 0 0 3px rgba(29,85,232,.07)}
.form-input.is-valid{border-color:var(--gn)}
.form-input.is-invalid{border-color:var(--rd);background:var(--rd2)}
.input-icon{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none}
.eye-btn{position:absolute;right:11px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--mu);background:none;border:none;font-size:15px;padding:3px}
.error-msg{font-size:11px;color:var(--rd);margin-top:3px}
.pwd-bars{display:flex;gap:3px;margin:5px 0 3px}
.pwd-bar{flex:1;height:3px;border-radius:2px;background:var(--bd);transition:background .2s}
.pwd-bar.s1{background:var(--rd)}.pwd-bar.s2{background:var(--am)}.pwd-bar.s3{background:#F59E0B}.pwd-bar.s4{background:var(--gn)}
.pwd-reqs{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-bottom:4px}
.pwd-req{font-size:10px;color:var(--mu);display:flex;align-items:center;gap:4px}
.pwd-req.ok{color:var(--gn)}
.pwd-req-dot{width:5px;height:5px;border-radius:50%;background:var(--bd);flex-shrink:0}
.pwd-req.ok .pwd-req-dot{background:var(--gn)}
.roles-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.role-card{border:1.5px solid var(--bd);border-radius:9px;padding:10px 6px;cursor:pointer;text-align:center;transition:all .15s;background:transparent}
.role-card:hover,.role-card.selected{border-color:var(--bl);background:var(--bl2)}
.role-card-ic{font-size:20px;margin-bottom:3px}
.role-card-nm{font-size:11px;font-weight:600}
.role-card.selected .role-card-nm{color:var(--bl)}
.role-card-ds{font-size:9px;color:var(--mu);margin-top:1px}
.checkbox-row{display:flex;align-items:flex-start;gap:9px;margin-bottom:12px;cursor:pointer}
.checkbox{width:15px;height:15px;border:1.5px solid var(--bd);border-radius:4px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.checkbox.checked{background:var(--bl);border-color:var(--bl)}
.checkbox-label{font-size:11px;color:var(--mu);line-height:1.5}
.submit-btn{width:100%;padding:12px;background:var(--bl);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:6px}
.submit-btn:hover{background:#1544C8}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}
.alert-box{padding:10px 13px;border-radius:9px;font-size:12px;margin-bottom:12px;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.alert-box.error{background:var(--rd2);color:var(--rd);border:1px solid var(--rd3)}
.alert-box.success{background:var(--gn2);color:var(--gn);border:1px solid var(--gn3)}
.alert-box.info{background:var(--bl2);color:var(--bl);border:1px solid var(--bl3)}
.security-note{background:var(--gn2);border:1px solid var(--gn3);border-radius:9px;padding:11px 13px;margin-top:16px;display:flex;gap:9px;font-size:11px;color:var(--gn);line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-box{background:#fff;border-radius:14px;padding:24px;max-width:460px;width:100%;max-height:80vh;overflow-y:auto}
.modal-box h2{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;margin-bottom:12px}
.modal-box p{font-size:12px;color:var(--mu);line-height:1.8;margin-bottom:8px}
.modal-close{width:100%;margin-top:14px;padding:10px;background:var(--bl);color:#fff;border:none;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer}
/* VERIFY */
.verify-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:40px}
.verify-card{background:#fff;border-radius:18px;padding:36px;max-width:440px;width:100%;text-align:center;box-shadow:0 4px 40px rgba(0,0,0,.08)}
.verify-icon{font-size:52px;margin-bottom:14px}
.verify-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:8px}
.verify-text{font-size:13px;color:var(--mu);line-height:1.7;margin-bottom:18px}
.verify-note{background:var(--bl2);border-radius:10px;padding:12px;margin-bottom:18px;font-size:12px;color:var(--bl);line-height:1.6}
/* PATIENT APP */
.pat-app{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.pat-header{background:linear-gradient(135deg,var(--bl),var(--gn));padding:16px 18px;display:flex;align-items:center;justify-content:space-between}
.pat-header-logo{display:flex;align-items:center;gap:9px}
.pat-header-ic{width:32px;height:32px;background:rgba(255,255,255,.2);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.pat-header-nm{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:#fff}
.pat-header-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer}
.pat-body{flex:1;padding:22px 18px}
.pat-hello{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;margin-bottom:5px}
.pat-welcome{font-size:14px;color:var(--mu);margin-bottom:22px}
.pat-buttons{display:flex;flex-direction:column;gap:12px}
.pat-btn{width:100%;padding:20px 22px;border-radius:16px;border:none;cursor:pointer;display:flex;align-items:center;gap:14px;text-align:left;transition:transform .15s}
.pat-btn:hover{transform:translateY(-2px)}
.pat-btn-icon{font-size:30px;flex-shrink:0}
.pat-btn-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700}
.pat-btn-sub{font-size:12px;opacity:.8;margin-top:2px}
.pat-btn.meds{background:linear-gradient(135deg,var(--bl2),#D4E0FB);border:2px solid var(--bl3)}
.pat-btn.meds .pat-btn-title{color:var(--bl)}
.pat-btn.rdv{background:linear-gradient(135deg,var(--gn2),#BBF7D0);border:2px solid var(--gn3)}
.pat-btn.rdv .pat-btn-title{color:var(--gn)}
.pat-btn.msg{background:linear-gradient(135deg,var(--am2),#FDE9C8);border:2px solid var(--am3)}
.pat-btn.msg .pat-btn-title{color:var(--am)}
.feel-title{font-size:14px;font-weight:600;color:var(--mu);margin-top:22px;margin-bottom:10px;text-align:center}
.feel-row{display:flex;gap:9px}
.feel-btn{flex:1;padding:12px 6px;border-radius:12px;border:2px solid var(--bd);background:var(--sur);cursor:pointer;font-size:12px;font-weight:600;text-align:center;transition:all .15s}
.feel-btn.active{border-color:var(--gn);background:var(--gn2);color:var(--gn)}
.sub-screen{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.sub-header{background:var(--sur);border-bottom:1px solid var(--bd);padding:14px 18px;display:flex;align-items:center;gap:11px}
.back-icon-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--bl);flex-shrink:0}
.sub-header-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:800}
.sub-body{flex:1;padding:18px;display:flex;flex-direction:column;gap:13px}
.med-item{background:var(--sur);border-radius:15px;border:2px solid var(--bd);padding:17px}
.med-item-name{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;margin-bottom:3px}
.med-item-dose{font-size:14px;color:var(--mu);margin-bottom:13px}
.med-item-btns{display:flex;gap:9px;flex-wrap:wrap}
.confirm-btn{padding:11px 18px;border-radius:12px;border:2px solid var(--bd);background:transparent;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.confirm-btn.done{background:var(--gn2);border-color:var(--gn);color:var(--gn)}
.rdv-item{background:var(--sur);border-radius:15px;border:2px solid var(--gn3);padding:22px}
.rdv-item-day{font-family:'Syne',sans-serif;font-size:40px;font-weight:800;color:var(--gn);line-height:1}
.rdv-item-month{font-size:16px;color:var(--gn);font-weight:600;margin-bottom:10px}
.rdv-item-title{font-size:18px;font-weight:700;margin-bottom:5px}
.rdv-item-place{font-size:14px;color:var(--mu)}
.rdv-item-time{font-size:16px;font-weight:600;color:var(--bl);margin-top:8px}
.msg-area{background:var(--sur);border-radius:15px;border:2px solid var(--bd);padding:18px;flex:1}
.msg-textarea{width:100%;border:none;outline:none;font-size:17px;line-height:1.7;resize:none;min-height:180px;background:transparent}
.msg-send-btn{width:100%;padding:16px;background:var(--am);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.msg-sent-msg{text-align:center;padding:36px;font-size:19px;font-weight:700;color:var(--gn)}
.lang-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lang-option{background:var(--sur);border:2px solid var(--bd);border-radius:12px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .15s}
.lang-option:hover,.lang-option.active{border-color:var(--bl);background:var(--bl2)}
.lang-flag{font-size:26px}
.lang-name{font-size:14px;font-weight:700}
/* AIDANT APP */
.aidant-app{display:flex;min-height:100vh}
.sidebar{width:var(--sw);background:var(--sur);border-right:1.5px solid var(--bd);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:100;overflow-y:auto}
.sidebar-header{padding:15px 13px 11px;border-bottom:1px solid var(--bd)}
.sidebar-logo{display:flex;align-items:center;gap:9px}
.sidebar-logo-ic{width:31px;height:31px;background:linear-gradient(135deg,var(--bl),var(--gn));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff}
.sidebar-logo-nm{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.5px}
.patient-card{margin:10px 10px 0;background:linear-gradient(135deg,var(--bl2),#E8F5EE);border:1px solid var(--bl3);border-radius:10px;padding:9px 11px;cursor:pointer}
.patient-card-name{font-size:12px;font-weight:600;color:var(--bl)}
.patient-card-info{font-size:10px;color:var(--mu);margin-top:2px}
.nav-section-label{padding:12px 11px 3px;font-size:9px;font-weight:600;color:#A8A49C;text-transform:uppercase;letter-spacing:1.2px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 9px;margin:1px 7px;border-radius:7px;cursor:pointer;border:none;background:transparent;width:calc(100% - 14px);text-align:left}
.nav-item:hover{background:var(--bg)}
.nav-item.active{background:var(--bl2)}
.nav-item-icon{font-size:13px;width:18px;text-align:center;color:var(--mu)}
.nav-item.active .nav-item-icon{color:var(--bl)}
.nav-item-label{font-size:12px;font-weight:500;color:var(--mu)}
.nav-item.active .nav-item-label{color:var(--bl);font-weight:600}
.sidebar-footer{margin-top:auto;padding:11px 13px;border-top:1px solid var(--bd);font-size:10px;color:#A8A49C}
.sidebar-footer strong{color:var(--gn);font-weight:600}
.sidebar-logout{margin:7px 10px;background:none;border:1px solid var(--bd);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:600;color:var(--mu);cursor:pointer;width:calc(100% - 20px)}
.sidebar-logout:hover{border-color:var(--rd);color:var(--rd);background:var(--rd2)}
.main-content{margin-left:var(--sw);flex:1;padding:24px 28px;min-height:100vh;max-width:calc(100vw - var(--sw))}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.page-title{font-family:'Syne',sans-serif;font-size:21px;font-weight:800;letter-spacing:-.5px}
.page-sub{font-size:12px;color:var(--mu);margin-top:2px}
.card{background:var(--sur);border:1px solid var(--bd);border-radius:12px;padding:15px 17px;margin-bottom:12px}
.card-title{font-size:9px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.grid2-main{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
.kpi-card{background:var(--sur);border:1px solid var(--bd);border-radius:11px;padding:13px 14px}
.kpi-value{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;line-height:1.1}
.kpi-label{font-size:10px;color:var(--mu);margin-top:3px;font-weight:500}
.alert-bar{display:flex;align-items:flex-start;gap:7px;padding:8px 11px;border-radius:7px;font-size:11px;margin-bottom:6px;font-weight:500;line-height:1.5}
.alert-bar.warn{background:var(--am2);color:var(--am);border:1px solid var(--am3)}
.alert-bar.danger{background:var(--rd2);color:var(--rd);border:1px solid var(--rd3)}
.alert-bar.ok{background:var(--gn2);color:var(--gn);border:1px solid var(--gn3)}
.alert-bar.info{background:var(--bl2);color:var(--bl);border:1px solid var(--bl3)}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.badge-blue{background:var(--bl2);color:var(--bl)}.badge-green{background:var(--gn2);color:var(--gn)}.badge-orange{background:var(--am2);color:var(--am)}.badge-red{background:var(--rd2);color:var(--rd)}.badge-gray{background:var(--bg);color:var(--mu);border:1px solid var(--bd)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px 2px 9px;border-radius:20px;font-size:11px;font-weight:500;margin:2px}
.tag-remove{background:none;border:none;cursor:pointer;font-size:13px;color:inherit;opacity:.6}
.med-row{display:flex;align-items:flex-start;justify-content:space-between;gap:11px;padding:11px 0;border-bottom:1px solid var(--bd)}
.med-row:last-child{border-bottom:none}
.med-row-name{font-size:13px;font-weight:600;margin-bottom:2px}
.med-row-info{font-size:11px;color:var(--mu)}
.dose-btns{display:flex;gap:5px;flex-wrap:wrap}
.dose-btn{padding:4px 10px;border-radius:18px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--bd);background:transparent;transition:all .12s}
.dose-btn.done{background:var(--gn2);border-color:var(--gn);color:var(--gn)}
.rdv-row{background:var(--sur);border:1px solid var(--bd);border-radius:11px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px}
.rdv-date-block{border-radius:8px;padding:7px 9px;text-align:center;min-width:44px;flex-shrink:0}
.rdv-date-day{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;line-height:1.1}
.rdv-date-mo{font-size:9px;text-transform:uppercase;font-weight:600}
.journal-entry{border-left:3px solid;padding:10px 0 10px 14px;margin-bottom:13px}
.journal-entry.bien{border-color:var(--gn)}.journal-entry.moyen{border-color:var(--am)}.journal-entry.difficile{border-color:var(--rd)}
.journal-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:4px;font-size:11px}
.journal-date{font-weight:600;color:var(--mu)}.journal-author{color:var(--bl);font-weight:500}
.journal-content{font-size:12px;line-height:1.75}
.aide-card{background:var(--sur);border:1px solid var(--bd);border-radius:11px;padding:14px;margin-bottom:10px}
.aide-name{font-size:13px;font-weight:600;margin-bottom:5px;line-height:1.4}
.aide-amount{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:7px}
.aide-info{font-size:11px;color:var(--mu);margin-bottom:3px}
.zarit-q{background:var(--sur);border:1px solid var(--bd);border-radius:11px;padding:12px 14px;margin-bottom:7px}

// ROOT APP
// ═══════════════════════════════════════
function App() {
  const [screen, setScreen] = useState('loading');
  const [user, setUser] = useState(null);
  const [sess, setSess] = useState(null);
  const [showTerms, setShowTerms] = useState(false);

  useEffect(() => {
    const s = session.get();
    if (s && s.access_token) {
      setSess(s); setUser(s.user || null);
      const confirmed = s.user?.email_confirmed_at || s.user?.confirmed_at;
      setScreen(confirmed ? 'app' : 'verify');
    } else { setScreen('auth'); }
  }, []);

  const onLogin = (s) => { session.set(s); setSess(s); setUser(s.user); const ok = s.user?.email_confirmed_at || s.user?.confirmed_at; setScreen(ok ? 'app' : 'verify'); };
  const onOut = async () => { if (sess?.access_token) await api.signOut(sess.access_token); session.set(null); setSess(null); setUser(null); setScreen('auth'); };

  if (screen === 'loading') return html`<${Loader}/>`;
  if (screen === 'verify') return html`<${Verify} email=${user?.email} onBack=${() => { session.set(null); setScreen('auth'); }}/>`;
  if (screen === 'app') {
    const role = user?.user_metadata?.role || 'aidant';
    if (role === 'patient') return html`<${PatientApp} user=${user} onOut=${onOut}/>`;
    if (role === 'soignant') return html`<${SoignantApp} onOut=${onOut}/>`;
    return html`<${AidantApp} user=${user} onOut=${onOut}/>`;
  }
  return html`<${AuthScreen} onLogin=${onLogin} showTerms=${showTerms} setShowTerms=${setShowTerms}/>`;
}

function AidantApp({ user, onOut }) {
  const [page, setPage] = useState('dashboard');

  const [meds, setMeds] = useState(MEDS0);
  const [rdvs, setRdvs] = useState(RDV0);
  const [journal, setJournal] = useState(JOURNAL0);
  const [zarit, setZarit] = useState({});
  const [aiTxt, setAiTxt] = useState(''); const [aiLoad, setAiLoad] = useState(false);
  const today = new Date().toISOString().split('T')[0];
  const prisCnt = meds.reduce((a, m) => a + m.horaires.filter(h => m.prises[today + '_' + h]).length, 0);
  const totCnt = meds.reduce((a, m) => a + m.horaires.length, 0);
  const zScore = Object.values(zarit).reduce((a, b) => a + b, 0);
  const zPct = ZARIT_QS.length ? Math.round((zScore / (ZARIT_QS.length * 4)) * 100) : 0;
  const zColor = zPct < 30 ? 'var(--gn)' : zPct < 60 ? 'var(--am)' : 'var(--rd)';
  const prenom = user?.user_metadata?.prenom || 'Marie';
  const togglePrise = (id, h) => { const k = today + '_' + h; setMeds(p => p.map(m => m.id !== id ? m : { ...m, prises: { ...m.prises, [k]: !m.prises[k] } })); };
  const alerts = [...meds.filter(m => m.renouv <= 10).map(m => ({ t: 'warn', m: 'Renouvellement ' + m.nom + ' dans ' + m.renouv + ' jours' })), ...rdvs.filter(r => !r.fait && !r.assigne).map(r => ({ t: 'danger', m: 'RDV non assigné : ' + r.titre }))];

  const genAI = async () => {
    setAiLoad(true); setAiTxt('');
    try {
      const ctx = journal.slice(0, 3).map(j => j.date + ': ' + j.contenu).join('\n');
      const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, messages: [{ role: 'user', content: 'Résumé clinique factuel 3-4 phrases pour médecin traitant:\n' + ctx + '\nPatient: ' + proche.prenom + ' ' + proche.nom + ', ' + proche.age + ' ans. Pathologies: ' + proche.pathologies.join(', ') + '.' }] }) });
      const d = await r.json();
      setAiTxt(d.content?.[0]?.text || 'Erreur.');
    } catch(e) { setAiTxt('Erreur de connexion à l\'API.'); }
    setAiLoad(false);
  };

  const ctx = { proche, setProche, meds, setMeds, rdvs, setRdvs, journal, setJournal, zarit, setZarit, zPct, zColor, aiTxt, aiLoad, genAI, today, togglePrise, prisCnt, totCnt, alerts, setPage, prenom };

  return html`
    <div class="aidant-app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo"><div class="sidebar-logo-ic">A</div><span class="sidebar-logo-nm">AidantPro</span></div>
        </div>
        <div class="patient-card" onClick=${() => setPage('dossier')}>
          <div class="patient-card-name">${proche.prenom} ${proche.nom}</div>
          <div class="patient-card-info">${proche.age} ans · Alzheimer modéré</div>
        </div>
        <div class="nav-section-label">Navigation</div>
        <nav style="padding:2px 6px;flex:1;overflow-y:auto">
          ${NAV_ITEMS.map(n => html`
            <button class=${'nav-item' + (page === n.id ? ' active' : '')} onClick=${() => setPage(n.id)}>
              <span class="nav-item-icon">${n.icon}</span>
              <span class="nav-item-label">${n.label}</span>
            </button>`)}
        </nav>
        <button class="sidebar-logout" onClick=${onOut}>⇄ Déconnexion</button>
        <div class="sidebar-footer">Bonjour <strong>${prenom}</strong> · Plan Famille</div>
      </aside>

      <main class="main-content">
        ${page === 'dashboard' && html`<${Dashboard} ...${ctx}/>`}
        ${page === 'dossier' && html`<${Dossier} ...${ctx}/>`}
        ${page === 'agenda' && html`<${AgendaPage} rdvs=${rdvs} setRdvs=${setRdvs}/>`}
        ${page === 'medicaments' && html`<${MedicamentsPage} meds=${meds} setMeds=${setMeds} today=${today} togglePrise=${togglePrise} prisCnt=${prisCnt} totCnt=${totCnt}/>`}
        ${page === 'journal' && html`<${JournalPage} journal=${journal} setJournal=${setJournal} today=${today} aiTxt=${aiTxt} aiLoad=${aiLoad} genAI=${genAI}/>`}
        ${page === 'aides' && html`<${AidesPage}/>`}
        ${page === 'bienetre' && html`<${BienetrePage} zarit=${zarit} setZarit=${setZarit} zPct=${zPct} zColor=${zColor}/>`}
        ${page === 'parametres' && html`<${ParametresPage} prenom=${prenom} onOut=${onOut}/>`}
      </main>
    </div>`;
}

// ─── AGENDA ────────────────────────────
function AgendaPage({ rdvs, setRdvs }) {
  const [show, setShow] = useState(false);
  const [nr, setNr] = useState({ titre: '', date: '', heure: '', lieu: '', assigne: '', notes: '' });
  const add = () => { if (!nr.titre || !nr.date) return; setRdvs(p => [...p, { ...nr, id: Date.now(), fait: false }].sort((a, b) => a.date.localeCompare(b.date))); setNr({ titre: '', date: '', heure: '', lieu: '', assigne: '', notes: '' }); setShow(false); };
  const av = rdvs.filter(r => !r.fait);
  return html`
    <div class="page-header"><div><div class="page-title">Agenda médical</div><div class="page-sub">${av.length} rendez-vous à venir</div></div><button class="btn btn-primary" onClick=${() => setShow(!show)}>+ Nouveau RDV</button></div>
    ${show && html`
      <div class="card">
        <div class="card-title">Nouveau rendez-vous</div>
        <div class="small-form">
          <div class="grid2">
            <div class="fg"><label class="fl">Titre *</label><input class="fi" value=${nr.titre} onInput=${e => setNr({ ...nr, titre: e.target.value })} placeholder="Neurologue Dr. Benali"/></div>
            <div class="fg"><label class="fl">Date *</label><input class="fi" type="date" value=${nr.date} onInput=${e => setNr({ ...nr, date: e.target.value })}/></div>
            <div class="fg"><label class="fl">Heure</label><input class="fi" value=${nr.heure} onInput=${e => setNr({ ...nr, heure: e.target.value })} placeholder="14h30"/></div>
            <div class="fg"><label class="fl">Lieu</label><input class="fi" value=${nr.lieu} onInput=${e => setNr({ ...nr, lieu: e.target.value })}/></div>
          </div>
          <div class="flex-center"><button class="btn btn-primary" onClick=${add}>Enregistrer</button><button class="btn btn-secondary" onClick=${() => setShow(false)}>Annuler</button></div>
        </div>
      </div>`}
    ${av.map(r => { const d = new Date(r.date + 'T12:00'); return html`
      <div class="rdv-row">
        <div class="rdv-date-block" style="background:var(--bl2)"><div class="rdv-date-day" style="color:var(--bl)">${r.date.split('-')[2]}</div><div class="rdv-date-mo" style="color:var(--bl)">${d.toLocaleString('fr-FR', { month: 'short' })}</div><div style="font-size:10px;color:var(--mu)">${r.heure}</div></div>
        <div style="flex:1"><div style="font-size:13px;font-weight:600;margin-bottom:3px">${r.titre}</div><div style="font-size:11px;color:var(--mu);margin-bottom:8px">${r.lieu}</div><div class="flex-center"><span class=${'badge ' + (r.assigne ? 'badge-blue' : 'badge-red')}>${r.assigne || 'Non assigné'}</span><button class="btn btn-secondary" style="padding:2px 8px;font-size:10px" onClick=${() => setRdvs(p => p.map(x => x.id === r.id ? { ...x, fait: true } : x))}>Effectué</button><button class="btn btn-danger" style="padding:2px 8px;font-size:10px" onClick=${() => setRdvs(p => p.filter(x => x.id !== r.id))}>×</button></div></div>
      </div>`; })}
    ${rdvs.filter(r => r.fait).length > 0 && html`
      <div style="font-size:10px;font-weight:600;color:var(--mu);text-transform:uppercase;margin:14px 0 7px">Passés</div>
      ${rdvs.filter(r => r.fait).map(r => html`<div class="rdv-row" style="opacity:.4"><div class="rdv-date-block" style="background:var(--bg)"><div class="rdv-date-day" style="color:var(--mu)">${r.date.split('-')[2]}</div></div><div><div style="font-size:13px;font-weight:600;text-decoration:line-through">${r.titre}</div><span class="badge badge-green">Effectué</span></div></div>`)}`}`;
}

// ─── MÉDICAMENTS ───────────────────────
function MedicamentsPage({ meds, setMeds, today, togglePrise, prisCnt, totCnt }) {
  const [show, setShow] = useState(false);
  const [nm, setNm] = useState({ nom: '', dose: '', horaires: '08h00', renouv: 30, indication: '' });
  const add = () => { if (!nm.nom) return; setMeds(p => [...p, { ...nm, id: Date.now(), horaires: nm.horaires.split(',').map(h => h.trim()), prises: {} }]); setNm({ nom: '', dose: '', horaires: '08h00', renouv: 30, indication: '' }); setShow(false); };
  return html`
    <div class="page-header"><div><div class="page-title">Médicaments</div><div class="page-sub">${prisCnt}/${totCnt} prises · ${meds.length} traitements</div></div><button class="btn btn-primary" onClick=${() => setShow(!show)}>+ Ajouter</button></div>
    <div class="progress-bar" style="margin-bottom:14px"><div class="progress-fill" style=${'width:' + (totCnt ? (prisCnt / totCnt) * 100 : 0) + '%;background:' + (prisCnt === totCnt ? 'var(--gn)' : 'var(--bl)')}></div></div>
    ${show && html`
      <div class="card small-form">
        <div class="card-title">Nouveau médicament</div>
        <div class="grid2">
          <div class="fg"><label class="fl">Nom *</label><input class="fi" value=${nm.nom} onInput=${e => setNm({ ...nm, nom: e.target.value })}/></div>
          <div class="fg"><label class="fl">Dosage</label><input class="fi" value=${nm.dose} onInput=${e => setNm({ ...nm, dose: e.target.value })} placeholder="500mg"/></div>
          <div class="fg"><label class="fl">Horaires (virgules)</label><input class="fi" value=${nm.horaires} onInput=${e => setNm({ ...nm, horaires: e.target.value })}/></div>
          <div class="fg"><label class="fl">Indication</label><input class="fi" value=${nm.indication} onInput=${e => setNm({ ...nm, indication: e.target.value })}/></div>
        </div>
        <div class="flex-center"><button class="btn btn-primary" onClick=${add}>Enregistrer</button><button class="btn btn-secondary" onClick=${() => setShow(false)}>Annuler</button></div>
      </div>`}
    <div class="card">
      ${meds.map(m => html`
        <div class="med-row">
          <div style="flex:1"><div class="flex-center" style="flex-wrap:wrap;margin-bottom:3px"><div class="med-row-name">${m.nom}</div><span class="badge badge-blue">${m.dose}</span>${m.renouv <= 10 && html`<span class="badge badge-orange">J-${m.renouv}</span>`}</div><div class="med-row-info">${m.indication}</div></div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><div class="dose-btns">${m.horaires.map(h => { const done = !!m.prises[today + '_' + h]; return html`<button class=${'dose-btn' + (done ? ' done' : '')} onClick=${() => togglePrise(m.id, h)}>${h} ${done ? '✓' : '○'}</button>`; })}</div><button class="btn btn-danger" style="padding:2px 7px;font-size:10px" onClick=${() => setMeds(p => p.filter(x => x.id !== m.id))}>Supprimer</button></div>
        </div>`)}
    </div>`;
}

// ─── JOURNAL ───────────────────────────
function JournalPage({ journal, setJournal, today, aiTxt, aiLoad, genAI }) {
  const [nn, setNn] = useState({ contenu: '', humeur: 'bien', tension: '', auteur: 'Marie' });
  const add = () => { if (!nn.contenu.trim()) return; setJournal(p => [{ ...nn, id: Date.now(), date: today }, ...p]); setNn({ contenu: '', humeur: 'bien', tension: '', auteur: 'Marie' }); };
  const hBadge = (h) => h === 'bien' ? 'badge-green' : h === 'moyen' ? 'badge-orange' : 'badge-red';
  return html`
    <div class="page-header"><div><div class="page-title">Journal de bord</div><div class="page-sub">${journal.length} observations</div></div><button class="btn btn-green" onClick=${genAI} disabled=${aiLoad}>${aiLoad ? html`<span class="spinner-sm"></span>` : '🤖 Résumé IA'}</button></div>
    ${aiTxt && html`<div class="ai-box"><div class="ai-label">Résumé IA — pour le médecin</div><div class="ai-text">${aiTxt}</div></div>`}
    <div class="card small-form" style="margin-bottom:14px">
      <div class="card-title">Nouvelle note — ${today}</div>
      <div class="fg"><label class="fl">Observation</label><textarea class="fi fta" placeholder="Comportement, humeur, médicaments, incidents…" value=${nn.contenu} onInput=${e => setNn({ ...nn, contenu: e.target.value })}></textarea></div>
      <div class="grid2">
        <div class="fg"><label class="fl">Tension</label><input class="fi" value=${nn.tension} onInput=${e => setNn({ ...nn, tension: e.target.value })} placeholder="13/8"/></div>
        <div class="fg"><label class="fl">Auteur</label><select class="fi" value=${nn.auteur} onChange=${e => setNn({ ...nn, auteur: e.target.value })}>${['Marie', 'Émile', 'Aide domicile', 'Autre'].map(v => html`<option value=${v}>${v}</option>`)}</select></div>
      </div>
      <div class="flex-between">
        <div class="flex-center">${[['bien', '😊 Bien'], ['moyen', '😐 Moyen'], ['difficile', '😔 Difficile']].map(([v, l]) => html`<button class=${'btn ' + (nn.humeur === v ? 'btn-primary' : 'btn-secondary')} style="padding:4px 10px;font-size:11px" onClick=${() => setNn({ ...nn, humeur: v })}>${l}</button>`)}</div>
        <button class="btn btn-primary" onClick=${add}>Enregistrer</button>
      </div>
    </div>
    ${journal.map(e => html`
      <div class=${'journal-entry ' + e.humeur}>
        <div class="journal-meta"><span class="journal-date">${e.date}</span><span class="journal-author">${e.auteur}</span><span class=${'badge ' + hBadge(e.humeur)}>${e.humeur}</span></div>
        <div class="journal-content">${e.contenu}</div>
        ${e.tension && html`<span style="font-size:10px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:2px 6px;color:var(--mu);margin-top:5px;display:inline-block">❤️ ${e.tension}</span>`}
        <button class="btn btn-danger mt8" style="padding:2px 7px;font-size:10px" onClick=${() => setJournal(p => p.filter(j => j.id !== e.id))}>Supprimer</button>
      </div>`)}`;
}

// ─── BIEN-ÊTRE ─────────────────────────
function BienetrePage({ zarit, setZarit, zPct, zColor }) {
  const nb = Object.keys(zarit).length;
  const label = zPct < 30 ? 'Faible charge' : zPct < 60 ? 'Charge modérée' : 'Charge élevée';
  const opts = ['Jamais', 'Rarement', 'Parfois', 'Souvent', 'Toujours'];
  return html`
    <div class="page-header"><div><div class="page-title">Mon bien-être</div><div class="page-sub">Échelle de Zarit · ${nb}/${ZARIT_QS.length}</div></div>${nb > 0 && html`<button class="btn btn-secondary" onClick=${() => setZarit({})}>Réinitialiser</button>`}</div>
    ${nb === ZARIT_QS.length && html`
      <div class="card" style="margin-bottom:14px">
        <div class="card-title">Score de charge aidant</div>
        <div style="display:flex;align-items:center;gap:14px">
          <div style="flex:1"><div class="progress-bar"><div class="progress-fill" style=${'width:' + zPct + '%;background:' + zColor}></div></div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mu);margin-top:3px"><span>Faible</span><span>Élevée</span></div></div>
          <div style="text-align:center;min-width:80px"><div style=${'font-family:Syne,sans-serif;font-size:30px;font-weight:800;color:' + zColor}>${zPct}%</div><div style=${'font-size:12px;font-weight:600;color:' + zColor}>${label}</div></div>
        </div>
        ${zPct >= 60 && html`<div class="alert-bar danger mt8">⚠ Charge élevée. <strong>0 800 360 360</strong> — numéro aidants gratuit 7j/7</div>`}
      </div>`}
    ${ZARIT_QS.map((q, i) => html`
      <div class="zarit-q">
        <div class="zarit-q-text"><strong style="color:var(--mu);font-size:11px">${i + 1}.</strong> ${q}</div>
        <div class="zarit-opts">${opts.map((opt, val) => html`<button class=${'zarit-opt' + (zarit[i] === val ? ' sel-' + val : '')} onClick=${() => setZarit(p => ({ ...p, [i]: val }))}>${opt}</button>`)}</div>
      </div>`)}
    <div class="card mt12">
      <div class="card-title">Ressources de soutien</div>
      ${[['Numéro national aidants', '0 800 360 360', 'Gratuit · 7j/7'], ['France Alzheimer', '0 811 112 112', 'Accompagnement familles'], ['Répit Grenoble', 'CCAS', 'Groupes de parole']].map((r, i) => html`<div class="info-row"><div><div style="font-size:12px;font-weight:600">${r[0]}</div><div style="font-size:10px;color:var(--mu)">${r[2]}</div></div><span class="badge badge-blue">${r[1]}</span></div>`)}
    </div>`;
}

          <input style="flex:1;padding:11px 14px;border:1.5px solid var(--bd);border-radius:10px;font-size:13px;outline:none" type="email" placeholder="Email professionnel" value=${email} onInput=${e => setEmail(e.target.value)}/>

}
